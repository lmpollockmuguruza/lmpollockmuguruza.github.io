      const roll = Math.random();
      let name;
      if (roll < 0.24) {
        name = `${pick(NAME_ROOTS)} ${pick(words)}`;
      } else if (roll < 0.44) {
        name = `${pick(NAME_PRE)}${pick(NAME_SUF)}`;
        name = name.charAt(0).toUpperCase() + name.slice(1);
        const tail = pick(tails);
        if (tail) name += ` ${tail}`;
      } else if (roll < 0.62) {
        const w = pick(words).replace(/\s+/g, '');
        // Only fuse short words into a compound; longer ones read better apart.
        name = w.length <= 7 ? `${pick(NAME_ROOTS)}${w.toLowerCase()}` : `${pick(NAME_ROOTS)} ${w}`;
      } else if (roll < 0.78) {
        const tail = pick(tails);
        name = tail ? `${pick(words)} ${tail}` : `${pick(words)} ${pick(NAME_ROOTS)}`;
      } else if (roll < 0.9) {
        name = `${pick(NAME_ROOTS)} ${pick(tails) || pick(words)}`;

      return name.replace(/(.)\1{2,}/gi, '$1$1').replace(/\s+/g, ' ').trim();

        { title: 'Fund life and the J-curve', body: 'A typical fund lasts about ten years: invest early, harvest later. Returns often dip before they rise — the J-curve — because fees and early failures hit before the winners pay off. Each fund here runs 40 quarters.' },
      ] },
      { module: 'Measuring Returns', icon: '📐', lessons: [
        { title: 'MOIC and TVPI', body: 'Multiple on invested capital. Invest $10M, get back $30M, that is 3x. Simple and intuitive, but it ignores how long the money was tied up. Your headline score in this game is a MOIC.' },
        { title: 'DPI is the one that counts', body: 'Distributions to Paid-In measures cash actually returned to LPs. Surveys of LPs have shown DPI rising sharply in importance for re-up decisions: a manager with big paper marks and no realisations has to explain themselves.' },
        { title: 'IRR', body: 'Internal Rate of Return — the annualised percentage return, which does account for time. A 3x in four years is far better than a 3x in twelve.' },
        { title: 'Realised vs unrealised', body: 'Paper gains can vanish. A return only counts for certain once you have exited and the cash is in. An unexited portfolio is not money in the bank.' },
      ] },
      { module: 'Sourcing & Screening', icon: '🔎', lessons: [
        { title: 'The funnel', body: 'A fund might see several hundred companies to make a handful of investments. Sourcing is networking, conferences, referrals, cold outbound and systematic sector mapping. Screening is the fast filter that kills most of them.' },
        { title: 'Proprietary deal flow', body: 'The cheapest deal is the one nobody else has seen. Funds invest heavily in origination — data tools, sector maps, relationships with operators — precisely to avoid bidding wars.' },
        { title: 'Deal flow and reputation', body: 'You can only invest in deals you actually see. A strong network and reputation bring better companies to your door, and give you an edge when several funds chase the same one.' },
        { title: 'Pricing: pre-money and post-money', body: 'Pre-money is what a company is worth before new investment. Add the investment and you get post-money. Your ownership equals your investment divided by post-money valuation.' },
        { title: 'Multiples', body: 'Startups are usually priced on a multiple of revenue, mature businesses on a multiple of EBITDA. Multiples expand in bull markets and shrink in bear markets — which is why the same company is worth very different amounts in different years.' },
      ] },
      { module: 'Diligence & the IC', icon: '📋', lessons: [
        { title: 'What diligence actually is', body: 'Commercial diligence tests whether customers really want it. Financial diligence — a quality of earnings review — tests whether the profits are real and repeatable. Technical and legal workstreams test whether what you are buying is what you think.' },
        { title: 'Diligence narrows, it does not remove', body: 'Better diligence gives you tighter ranges, not certainty. That is why this game shows you ranges rather than numbers, and why the ranges shrink as your diligence capability improves.' },
        { title: 'Sector-specific diligence', body: 'Every vertical has its own questions. Software cares about net revenue retention; healthcare services cares about payer mix; biotech cares about trial endpoints; infrastructure cares about counterparty credit. Each deal card here lists what its sector actually gets tested on.' },
        { title: 'The investment committee', body: 'After diligence, the deal team writes a memo and presents to the firm\'s partners. The IC is where the case gets stress-tested before capital is committed — on price, on diligence coverage, on portfolio concentration and on fit with the stated strategy.' },
        { title: 'Why the IC says no', body: 'The most common rejections are not "bad company". They are "we have not done the work", "we are paying too much for what we know", and "this would make us far too concentrated". Watch which of those the committee raises with you.' },
      ] },
      { module: 'Terms & Negotiation', icon: '🤝', lessons: [
        { title: 'The term sheet', body: 'A short summary of a deal\'s key terms before lawyers draft contracts. Price is only part of it — control and protection terms matter just as much.' },
        { title: 'Board seat', body: 'A seat on the board lets you vote on big decisions: fundraising, M&A, hiring or firing the CEO. It is influence without owning the whole company.' },
        { title: 'Pro-rata rights', body: 'The right to invest again in later rounds to keep your ownership from shrinking. Crucial for doubling down on your winners.' },
        { title: 'Liquidation preference', body: 'Decides who gets paid first in an exit. A 1x preference means that investor gets their money back before others share the rest. Your Legal & Structuring capability is what turns a disaster into a partial recovery.' },
        { title: 'Reading founders', body: 'Desperate founders accept low offers but their companies are often riskier. Arrogant founders rarely budge and walk fast. Push too hard and a founder can walk away permanently — and they remember a bad negotiation next time.' },
      ] },
      { module: 'Managing the Portfolio', icon: '💼', lessons: [
        { title: 'Diversification and concentration', body: 'Spreading bets across sectors and stages so one bad year does not sink the fund. The opposite pressure is conviction: too many small positions and nothing moves the needle. The IC watches both.' },
        { title: 'Reserves and follow-ons', body: 'Smart funds hold back dry powder to follow their winners into future rounds. Backing your best companies again is often more valuable than finding brand-new ones.' },
        { title: 'Dilution and down rounds', body: 'Issuing new shares shrinks existing owners\' stake. A down round raises money at a lower price than before — painful, often with harsh terms. Pro-rata rights help you defend your position.' },
        { title: 'Value creation', body: 'Top funds do not just write cheques. They help with hiring, customers, pricing and strategy. In PE especially, operational improvement — not financial engineering — is now the main engine of returns.' },
        { title: 'The hundred-day plan', body: 'Almost every PE firm writes one: the sequence of actions in the first hundred days after acquiring a company, while the organisation is still open to change. Baseline the business, install reporting, launch the first initiatives.' },
      ] },
      { module: 'Private Equity Mechanics', icon: '🏭', lessons: [
        { title: 'The three levers', body: 'PE creates value three ways: growing EBITDA, selling at a higher multiple than you bought at, and paying down acquisition debt with the company\'s own cash flow. Operational improvement is now the most used of the three.' },
        { title: 'Leverage', body: 'Buyouts use borrowed money so less equity is needed. That amplifies returns — and losses. Take on debt in this game and your equity cheque shrinks while your exposure to a bad quarter grows.' },
        { title: 'Covenants', body: 'Lenders impose conditions, typically that debt stays below a set multiple of earnings. Breach one in a downturn and the lender, not you, controls what happens next.' },
        { title: 'Buy-and-build', body: 'Buy a platform, then bolt on smaller competitors. A large majority of buyout activity now involves add-on acquisitions, because you can buy small companies at low multiples and sell the combined group at a high one.' },
        { title: 'Operating partners', body: 'Ex-CEOs and functional experts who work inside portfolio companies: margin programmes, digital transformation, add-on integration and getting the asset ready to sell.' },
      ] },
      { module: 'Exits & Cycles', icon: '🚪', lessons: [
        { title: 'The four routes out', body: 'A strategic buyer in the sector, another sponsor, an IPO, or a secondary sale of your stake. Each has a different probability of closing and a different price. This game makes you pick.' },
        { title: 'Hold periods', body: 'Investments need years to mature. Selling too early leaves money on the table; the game enforces a minimum hold, longer for PE and for capital-intensive verticals.' },
        { title: 'Market cycles', body: 'Bull markets bring high valuations and easy exits; bear markets bring cheap deals but few buyers. Great investors buy carefully in booms and hunt bargains in busts.' },
        { title: 'Secondaries', body: 'When exits are shut and LPs want cash, funds sell positions to secondaries buyers at a discount. It hurts the multiple and helps the DPI — an entirely real trade-off.' },
      ] },
      { module: 'Building a Firm', icon: '🏛️', lessons: [
        { title: 'One fund is not a firm', body: 'A firm exists when it raises a second fund, and a third. Fund I proves you can invest; Fund II proves LPs will back you again. In endless mode this game runs that whole arc.' },
        { title: 'What LPs look at on a re-up', body: 'Realised cash first. Growing DPI across vintages is far more persuasive than rising paper marks, because marks are the GP\'s own opinion and cash is not.' },
        { title: 'Fund size is a strategy decision', body: 'A bigger fund means bigger fees but a higher bar: the same dollar of profit is a smaller multiple. Many good small funds have been ruined by raising too much.' },
        { title: 'Continuation vehicles', body: 'When a fund reaches the end of its life still holding a company it believes in, it can raise a new vehicle to buy that asset from itself. Original LPs get liquidity; the GP keeps backing the winner.' },
        { title: 'Key-person risk', body: 'LP agreements name the individuals the money was really backing. If they leave, LPs can suspend new investments. It is why partner retention is a firm-level risk, not an HR issue.' },
      ] },
    ];

    const SPOTLIGHT_STEPS = [
      { id: 'header', title: 'Fund Overview', desc: 'Your fund, its vintage, market conditions, quarter progress, and current MOIC against target.' },
      { id: 'metrics', title: 'Key Metrics', desc: 'Dry powder is uninvested cash. Deployed is capital at work. DPI is cash actually returned to LPs — the number they judge you on. LP confidence decides whether you get a next fund.' },
      { id: 'dealflow', title: 'Deal Flow', desc: 'Companies seeking investment. Each carries its vertical\'s own economics and its own diligence questions. Competitive deals (🔥) have other funds bidding — decide fast.' },
      { id: 'deal-metrics-example', title: 'Company Metrics', desc: 'Revenue, growth, margin and TAM are surface-level. The moat, business model and customer concentration tell you far more about durability.' },
      { id: 'dd-example', title: 'Due Diligence', desc: 'Diligence returns ranges, not answers. Better diligence narrows the range and finds red flags. Each vertical is tested on different things.' },
      { id: 'firmpanel', title: 'The Firm', desc: 'Nine capability tracks. Every level costs capital up front and quarterly running costs forever. You cannot afford all of them — pick a shape.' },
      { id: 'portfolio', title: 'Portfolio', desc: 'Your holdings. Value moves each quarter with performance, market and sector. After the minimum hold you choose an exit route.' },
      { id: 'nextquarter', title: 'Advance Time', desc: 'Move to the next quarter. Fees and running costs settle, portfolio values update, events fire and new deals may arrive.' },
      { id: 'activity', title: 'Activity Log', desc: 'Newest first, grouped by quarter. Green is good, red is bad, amber needs attention. Open the full log for the fund\'s whole history.' },
    ];

    // =========================================================================
    // GENERATION HELPERS
    // =========================================================================

    const sectorWeight = (name, fundType) => (fundType === 'VC' ? SECTORS[name].vc : SECTORS[name].pe);

    const pickSector = (fundType, thesis, allowOffThesis) => {
      const universe = (thesis && thesis.length && !allowOffThesis) ? thesis : SECTOR_KEYS;
      const weights = universe.map(n => sectorWeight(n, fundType));
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < universe.length; i++) {
        r -= weights[i];
        if (r <= 0) return universe[i];
      }
      return universe[universe.length - 1];
    };

    const baseFundSize = (fundType) => (fundType === 'VC' ? 100 : 500);

    const minHoldFor = (fundType, sector) => {
      const base = fundType === 'VC' ? 8 : 11;
      return Math.round(base * SECTORS[sector].hold);
    };

    const generateCompany = (quarter, fundType, opts = {}) => {
      const {
        qualityBonus = 0, marketCondition = 'normal', sectorBoost = null, sectorHit = null,
        hotMult = 1, thesis = null, proprietary = 0, fundSize = null, forceSector = null,
      } = opts;

      const isVC = fundType === 'VC';
      const offThesis = !!(thesis && thesis.length && !forceSector && Math.random() < 0.06);
      const sector = forceSector || pickSector(fundType, thesis, offThesis);
      const S = SECTORS[sector];
      const market = MARKET_CONDITIONS[marketCondition];
      const size = fundSize || baseFundSize(fundType);
      const scale = size / baseFundSize(fundType);

      const stages = isVC ? STAGES_VC : STAGES_PE;
      const stage = stages[Math.floor(Math.random() * stages.length)];
      const stageIdx = stages.indexOf(stage);

      // Later stages are larger and more proven.
      const stageScale = isVC ? [0.12, 0.35, 1.0, 2.4][stageIdx] : [0.75, 1.35, 1.0, 0.8][stageIdx];

      const revenue = between(isVC ? S.rev : S.peRev) * stageScale * scale;
      const growth = between(isVC ? S.growth : S.peGrowth) * (isVC ? (1.25 - stageIdx * 0.12) : 1);
      const margin = between(isVC ? S.margin : S.peMargin) + (isVC ? stageIdx * 6 : 0);
      const marketSize = between(S.tam);
      const teamScore = clamp(Math.round(between([46, 96]) + qualityBonus * 70), 20, 100);
      const customerConc = clamp(Math.round(between([8, 62]) * (1 + S.cycle * 0.5)), 5, 85);

      const moat = pick(MOATS);
      const model = pick(BUSINESS_MODELS);
      const founderBg = pick(FOUNDER_BACKGROUNDS);

      // Enterprise value: revenue multiple for VC, EBITDA multiple for PE.
      let askMultiple = between(isVC ? S.mult : S.peMult) * market.multipleModifier;
      if (sectorBoost === sector) askMultiple *= 1.28;
      if (sectorHit === sector) askMultiple *= 0.78;
      askMultiple *= founderBg.ask;
      askMultiple = Math.max(1.2, askMultiple);

      const isBuyout = stage === 'Buyout' || stage === 'Carve-out';
      const stakeFraction = isVC ? between([0.08, 0.24])
        : isBuyout ? between([0.72, 1.0])
        : between([0.14, 0.38]);

      // Cheque size is drawn log-uniformly from a stage-appropriate band, so
      // most of what crosses the desk is small and only occasionally does
      // something fund-defining appear. The company is then scaled to fit that
      // cheque at the multiple already agreed, which keeps pricing coherent.
      const chequeBand = (isVC
        ? { 'Pre-seed': [0.004, 0.025], 'Seed': [0.008, 0.05], 'Series A': [0.025, 0.11], 'Series B': [0.05, 0.24] }
        : { 'Growth': [0.025, 0.12], 'Late Growth': [0.05, 0.2], 'Buyout': [0.07, 0.28], 'Carve-out': [0.05, 0.24] }
      )[stage] || [0.02, 0.15];
      const loC = size * chequeBand[0], hiC = size * chequeBand[1];
      const askAmount = Math.exp(Math.log(loC) + Math.random() * (Math.log(hiC) - Math.log(loC)));

      const ev = askAmount / stakeFraction;
      const valuationBase = ev / askMultiple;
      const revenueScaled = isVC ? valuationBase : valuationBase / Math.max(0.04, margin / 100);
      const ebitda = isVC ? revenueScaled * (margin / 100) : valuationBase;

      // Deal quality is independent of size: it is about the business, not the
      // cheque. Centred well below "good" so most of the funnel is mediocre.
      const quality = clamp(
        (teamScore / 100) * 0.26
        + clamp(marketSize / 150, 0, 1) * 0.10
        + clamp((isVC ? growth / 190 : growth / 32), 0, 1) * 0.20
        + (margin > 0 ? 0.11 : 0.02)
        + (moat.mult - 1) * 1.15
        + founderBg.quality
        + clamp(1 - customerConc / 90, 0, 1) * 0.08
        + (Math.random() - 0.5) * 0.16          // what the numbers do not show
        + (Math.random() < 0.12 ? between([0.08, 0.24]) : 0)  // the power-law tail
        - 0.13
        + qualityBonus,
        0.05, 0.96
      );

      let founderType;
      const roll = Math.random();
      if (quality < 0.42) founderType = roll < 0.48 ? 'Desperate' : roll < 0.8 ? 'Reasonable' : 'Confident';
      else if (quality > 0.68) founderType = roll < 0.08 ? 'Desperate' : roll < 0.38 ? 'Reasonable' : roll < 0.72 ? 'Confident' : 'Arrogant';
      else founderType = pick(FOUNDER_TYPES);

      const hotChance = 0.26 * market.competitionIntensity * hotMult * (1 - proprietary);
      const isHot = quality > 0.55 && Math.random() < hotChance;

      const leverageAvailable = !isVC && isBuyout && ebitda > 0;

      return {
        id: `${quarter}-${Math.random().toString(36).slice(2, 11)}`,
        name: generateCompanyName(sector, fundType),
        sector, stage, founderType,
        founderBg: founderBg.name, founderNote: founderBg.note,
        moat: moat.name, moatNote: moat.note, moatMult: moat.mult,
        model,
        metrics: {
          revenue: revenueScaled, growth, margin, teamScore,
          marketSize: Math.round(marketSize),
          ebitda, customerConc,
        },
        ev,
        ask: { amount: askAmount, multiple: askMultiple },
        stakeFraction,
        leverageAvailable,
        trueQuality: quality,
        dueDiligenceComplete: false,
        ddFindings: null,
        isHot,
        offThesis,
        competingFund: isHot ? pick(COMPETITOR_FUNDS) : null,
        turnsToDecide: isHot ? 2 : null,
        hasWalked: false,
        negotiationHistory: [],
        quarterAppeared: quarter,
      };
    };

    // Diligence returns ranges and sector-specific verdicts, never certainty.
    const generateDD = (company, accuracy, sectorFocusBonus = 0) => {
      const acc = clamp(accuracy + sectorFocusBonus, 0.2, 0.97);
      const q = company.trueQuality;
      const width = (1 - acc) * 40;
      const S = SECTORS[company.sector];

      const teamTrue = company.metrics.teamScore;
      const teamRange = [
        Math.max(0, Math.round(teamTrue - width + (Math.random() - 0.5) * 8)),
        Math.min(100, Math.round(teamTrue + width + (Math.random() - 0.5) * 8)),
      ];

      const churnTrue = q > 0.6 ? between([2, 10]) : between([8, 33]);
      const churnRange = [
        Math.round(Math.max(0, churnTrue - width * 0.3) * 10) / 10,
        Math.round((churnTrue + width * 0.4) * 10) / 10,
      ];

      // Each sector's real diligence questions, scored against true quality.
      const checks = S.dd.map(label => {
        const noise = (Math.random() - 0.5) * (1 - acc) * 1.5;
        const score = q + noise + (Math.random() - 0.5) * 0.25;
        return {
          label,
          verdict: score > 0.62 ? 'Clean' : score > 0.42 ? 'Watch' : 'Concern',
          tone: score > 0.62 ? 'good' : score > 0.42 ? 'warn' : 'bad',
        };
      });

      const detect = acc * 0.85;
      const hasRedFlag = q < 0.48 && Math.random() < 0.65;
      const hasUpside = q > 0.68 && Math.random() < 0.45;

      const RED = ['Revenue recognised early on multi-year contracts', 'Senior team turnover of 40% in twelve months',
        'Three customer references declined to speak', 'Unresolved litigation with a former distributor',
        'Related-party transactions with the founder\'s other company', 'Key supplier contract expires in six months',
        'Reported margin flattered by capitalised costs'];
      const GOOD = ['Signed pipeline covers next year\'s plan', 'Two enterprise pilots converting to multi-year contracts',
        'Granted patent with enforcement history', 'Pricing power confirmed by customer interviews',
        'Contracted backlog extends three years'];

      const qoeAdjust = company.metrics.ebitda > 0
        ? Math.round(between([0, 22]) * (1.2 - acc) * 10) / 10
        : 0;

      return {
        accuracy: Math.round(acc * 100),
        teamRange, churnRange, checks,
        redFlag: (hasRedFlag && Math.random() < detect) ? pick(RED) : null,
        upside: (hasUpside && Math.random() < detect) ? pick(GOOD) : null,
        qoeAdjust,
        missedSomething: acc < 0.7 && Math.random() < 0.35,
      };
    };

    const getDDCost = (fundType, stage, sector, ddLevel, ddCostMult = 1, fundSize = null) => {
      const size = fundSize || baseFundSize(fundType);
      const scale = size / baseFundSize(fundType);
      const base = fundType === 'VC' ? 0.4 : 1.5;
      const stageMod = stage === 'Pre-seed' || stage === 'Seed' ? 0.7
        : stage === 'Buyout' || stage === 'Carve-out' ? 1.6 : 1.0;
      const sectorMod = 1 + (SECTORS[sector] ? SECTORS[sector].reg * 0.5 + SECTORS[sector].cap * 0.25 : 0);
      const levelMod = UPGRADES.ddProgram.levels[ddLevel].ddCostMod;
      return Math.round(base * stageMod * sectorMod * levelMod * ddCostMult * scale * 10) / 10;
    };

    const getNewDealCount = (quarter, marketCondition, netFlowBonus, extraDeals, dealFlowMult = 1) => {
      const market = MARKET_CONDITIONS[marketCondition];
      if (quarter <= 2) return Math.floor(Math.random() * 2) + 2;
      const chance = clamp(0.7 * market.dealFlow * dealFlowMult + netFlowBonus * 0.32, 0.05, 0.97);
      let count = 0;
      const slots = Math.floor(Math.random() * 2) + 1 + (Math.random() < extraDeals ? 1 : 0);
      for (let i = 0; i < slots; i++) if (Math.random() < chance) count++;
      if (Math.random() < 0.1 * market.dealFlow) count++;
      return count;
    };

    // =========================================================================
    // INVESTMENT COMMITTEE
    // Three partners, three lenses: is the work done, is the price defensible,
    // and does this leave the fund too concentrated? Two of three must approve.
    // =========================================================================

    const IC_PARTNERS = [
      { name: 'Managing Partner', lens: 'price & conviction' },
      { name: 'Head of Diligence', lens: 'evidence' },
      { name: 'Risk Partner', lens: 'portfolio construction' },
    ];

    const evaluateIC = (deal, terms, ctx) => {
      const { fundSize, portfolio, deployed, thesis, reputation, icThreshold } = ctx;
      const S = SECTORS[deal.sector];
      const sectorMedian = ((deal.stage === 'Buyout' || deal.stage === 'Carve-out' || !ctx.isVC) ? S.peMult : S.mult);
      const median = (sectorMedian[0] + sectorMedian[1]) / 2;
      const priceVsSector = terms.multiple / median;
      const checkPct = (terms.equity != null ? terms.equity : terms.amount) / fundSize;
      const sectorExposure = portfolio.filter(p => p.sector === deal.sector)
        .reduce((s, p) => s + p.investedAmount, 0) + (terms.equity != null ? terms.equity : terms.amount);
      const sectorPct = sectorExposure / fundSize;

      const votes = [];

      // Managing Partner — price discipline and conviction.
      if (deal.offThesis && thesis && thesis.length) {
        votes.push({ partner: 'Managing Partner', vote: false, reason: `Outside our stated strategy. We raised on ${thesis.length} verticals and this is not one of them.` });
      } else if (priceVsSector > 1.45) {
        votes.push({ partner: 'Managing Partner', vote: false, reason: `${terms.multiple.toFixed(1)}x is well above where ${deal.sector} clears. We would be underwriting multiple expansion we cannot control.` });
      } else if (priceVsSector > 1.18 && deal.trueQuality < 0.6) {
        votes.push({ partner: 'Managing Partner', vote: false, reason: 'Full price for an asset the work has not made me confident about.' });
      } else {
        votes.push({ partner: 'Managing Partner', vote: true, reason: priceVsSector < 0.85 ? 'Priced below the sector. If the diligence holds, this is our kind of entry.' : 'Price is defensible against sector comparables.' });
      }

      // Head of Diligence — evidence.
      if (!deal.dueDiligenceComplete && checkPct > icThreshold * 0.6) {
        votes.push({ partner: 'Head of Diligence', vote: false, reason: 'We have not done the work. I am not signing off a cheque this size on a management presentation.' });
      } else if (deal.ddFindings && deal.ddFindings.redFlag) {
        votes.push({ partner: 'Head of Diligence', vote: Math.random() < 0.3, reason: `Diligence surfaced a real issue: ${deal.ddFindings.redFlag.toLowerCase()}.` });
      } else if (!deal.dueDiligenceComplete) {
        votes.push({ partner: 'Head of Diligence', vote: true, reason: 'Small enough cheque that I can live without a full workstream.' });
      } else {
        const concerns = deal.ddFindings.checks.filter(c => c.tone === 'bad').length;
        votes.push({
          partner: 'Head of Diligence',
          vote: concerns < 2,
          reason: concerns >= 2 ? `${concerns} of the sector's core diligence questions came back as concerns.` : 'Diligence is clean enough on the questions that matter in this sector.',
        });
      }

      // Risk Partner — portfolio construction.
      if (checkPct > icThreshold * 2.4) {
        votes.push({ partner: 'Risk Partner', vote: false, reason: `At ${(checkPct * 100).toFixed(0)}% of the fund this single position could decide our vintage.` });
      } else if (sectorPct > 0.42) {
        votes.push({ partner: 'Risk Partner', vote: false, reason: `This takes ${deal.sector} to ${(sectorPct * 100).toFixed(0)}% of the fund. That is a sector bet, not a portfolio.` });
      } else if (portfolio.length < 3 && checkPct > icThreshold * 1.5) {
        votes.push({ partner: 'Risk Partner', vote: reputation > 55, reason: 'Large cheque this early in the fund leaves us little room to build a portfolio.' });
      } else {
        votes.push({ partner: 'Risk Partner', vote: true, reason: 'Sizing and sector exposure are within where we said we would run the book.' });
      }

      const yes = votes.filter(v => v.vote).length;
      return { votes, approved: yes >= 2, yes };
    };

    // =========================================================================
    // SAVE / LOAD
    // =========================================================================

    const saveGameState = (state) => {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ version: SAVE_VERSION, savedAt: new Date().toISOString(), ...state }));
        return true;
      } catch (e) { return false; }
    };

    const loadGameState = () => {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (data.version !== SAVE_VERSION) return null;
        return data;
      } catch (e) { return null; }
    };

    const deleteSave = () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} };
    const hasSavedGame = () => !!loadGameState();

    // =========================================================================
    // STYLES
    // =========================================================================

    const s = {
      app: { minHeight: '100vh', background: '#FAFAF8' },
      container: { maxWidth: '1200px', margin: '0 auto', padding: '20px' },

    // =========================================================================
    // LP MANDATES
    // Every so often the LP advisory committee sets an explicit objective with
    // a deadline. Hitting it buys patience; missing it costs confidence.
    // =========================================================================

    const MANDATE_TYPES = [
      { id: 'dpi', label: t => `Return at least ${t.toFixed(2)}x DPI to LPs`, hint: 'Realise investments. Paper marks do not count.' },
      { id: 'deploy', label: t => `Put at least ${Math.round(t * 100)}% of the fund to work`, hint: 'Uninvested capital still charges fees. LPs notice.' },
      { id: 'positions', label: t => `Hold at least ${t} active positions`, hint: 'A concentrated book is a bet, not a portfolio.' },
      { id: 'concentration', label: t => `Keep every vertical below ${Math.round(t * 100)}% of invested capital`, hint: 'Diversification is the mandate you signed.' },
      { id: 'tvpi', label: t => `Carry the fund at ${t.toFixed(2)}x TVPI or better`, hint: 'Marks plus cash, against committed capital.' },
    ];

    const makeMandate = (quarter, fundSize, portfolioCount) => {
      const progress = quarter / FUND_LIFE_Q;
      const pool = progress < 0.3
        ? ['deploy', 'positions', 'tvpi']
        : progress < 0.65
        ? ['deploy', 'concentration', 'tvpi', 'dpi', 'positions']
        : ['dpi', 'tvpi', 'concentration'];
      const id = pick(pool);
      const target = id === 'dpi' ? (progress < 0.5 ? 0.2 : progress < 0.8 ? 0.5 : 0.85)
        : id === 'deploy' ? (progress < 0.35 ? 0.35 : 0.65)
        : id === 'positions' ? Math.max(3, Math.min(8, portfolioCount + 2))
        : id === 'concentration' ? 0.4
        : (progress < 0.4 ? 1.1 : progress < 0.75 ? 1.5 : 2.0);
      return { id, target, deadline: Math.min(FUND_LIFE_Q, quarter + (id === 'dpi' ? 12 : 9)), issued: quarter };
    };

    const evaluateMandate = (m, ctx) => {
      switch (m.id) {
        case 'dpi': return ctx.dpi >= m.target;
        case 'deploy': return ctx.deployedEver / ctx.fundSize >= m.target;
        case 'positions': return ctx.portfolio.length >= m.target;
        case 'concentration': {
          const total = ctx.portfolio.reduce((a, p) => a + p.investedAmount, 0);
          if (total <= 0) return true;
          const bySector = {};
          ctx.portfolio.forEach(p => { bySector[p.sector] = (bySector[p.sector] || 0) + p.investedAmount; });
          return Math.max(...Object.values(bySector)) / total <= m.target;
        }
        case 'tvpi': return ctx.tvpi >= m.target;
        default: return true;
      }
    };

    const mandateProgress = (m, ctx) => {
      switch (m.id) {
        case 'dpi': return `${ctx.dpi.toFixed(2)}x of ${m.target.toFixed(2)}x`;
        case 'deploy': return `${Math.round(ctx.deployedEver / ctx.fundSize * 100)}% of ${Math.round(m.target * 100)}%`;
        case 'positions': return `${ctx.portfolio.length} of ${m.target}`;
        case 'concentration': {
          const total = ctx.portfolio.reduce((a, p) => a + p.investedAmount, 0);
          if (total <= 0) return 'no exposure yet';
          const bySector = {};
          ctx.portfolio.forEach(p => { bySector[p.sector] = (bySector[p.sector] || 0) + p.investedAmount; });
          return `largest is ${Math.round(Math.max(...Object.values(bySector)) / total * 100)}%`;
        }
        case 'tvpi': return `${ctx.tvpi.toFixed(2)}x of ${m.target.toFixed(2)}x`;
        default: return '';
      }
    };

      const targetMOIC = Math.round((isVC ? 2.4 : 2.0) * diff.targetMult * 10) / 10;

      // ---- derived fund metrics ----
      const nav = portfolio.reduce((a, p) => a + p.currentValue, 0);
      const dryPowder = cash;
      const tvpi = fundSize > 0 ? (cash + nav + distributed) / fundSize : 0;
      const dpi = fundSize > 0 ? distributed / fundSize : 0;
      // A fund may only reinvest a limited slice of what it realises; the rest
      // must go back to LPs. It is the main reason returns cannot compound
      // indefinitely inside a single vehicle.
      const recycleCapacity = fundSize * (0.15 + lvl('irDesk').recycle);
      const recycleRoom = Math.max(0, recycleCapacity - recycled);
      const years = Math.max(0.25, quarter / 4);
      const irr = tvpi > 0 ? (Math.pow(Math.max(tvpi, 0.01), 1 / years) - 1) * 100 : 0;
      const quarterlyOpex = UPGRADE_KEYS.reduce((a, k) => a + lvl(k).o, 0) * costScale * diff.opexMult;
      const inInvestmentPeriod = quarter <= FUND_LIFE_Q / 2;
      // 2% a year on committed capital during the investment period, then on
      // invested capital once it ends — the standard step-down.
      const feeIncome = (inInvestmentPeriod ? fundSize : deployed) * 0.02 * (1 - feeCut) / 4;
      const fundExpenses = fundSize * 0.001;
      // Fees leave the fund whether or not the firm needs them; if the firm
      // costs more than the fee covers, the shortfall is drawn from the fund
      // too. Either way this is capital that will never be invested.
      const quarterlyDrag = Math.max(feeIncome, quarterlyOpex) + fundExpenses;
      const feeSurplus = Math.max(0, feeIncome - quarterlyOpex);

      const mandateCtx = { dpi, tvpi, portfolio, fundSize, deployedEver };

      // =====================================================================
      // ACTIVITY LOG
      // Entries carry the quarter they happened in and a monotonic sequence
      // number. Nothing is ever logged from inside a state updater, so the
      // ordering is deterministic: newest quarter first, chronological within.
      // =====================================================================

      const pushLogs = useCallback((entries, q) => {
        const list = entries.filter(Boolean);
        if (!list.length) return;
        const start = logSeq.current;
        logSeq.current += list.length;
        const mapped = list.map((e, i) => ({
          msg: e.msg, type: e.type || 'info', q: e.q != null ? e.q : q, seq: start + i + 1, id: start + i + 1,
        }));
        setLog(prev => [...prev, ...mapped].slice(-400));
      }, []);

      const addLog = useCallback((msg, type = 'info') => {
        pushLogs([{ msg, type }], quarterRef.current);
      }, [pushLogs]);

      const groupedLog = useMemo(() => {
        const sorted = [...log].sort((a, b) => (b.q - a.q) || (a.seq - b.seq));
        const groups = [];
        sorted.forEach(e => {
          const last = groups[groups.length - 1];
          if (last && last.q === e.q) last.items.push(e);
          else groups.push({ q: e.q, items: [e] });
        });
        return groups;
      }, [log]);

      const logScrollRef = useRef(null);
      useEffect(() => { if (logScrollRef.current) logScrollRef.current.scrollTop = 0; }, [quarter, log.length]);

      // =====================================================================
      // SAVE / LOAD
      // =====================================================================

      const snapshot = () => ({
        fundType, fundName, firmName, fundNumber, fundSize, mode, thesis, difficulty,
        quarter, cash, deployed, deployedEver, realized, distributed, recycled, feesPaid, gpEarnings, feeCut,
        portfolio, failedCompanies, exits, dealFlow, log, logSeq: logSeq.current,
        upgrades, marketCondition, marketEvent, eventTurns, sectorBoost, sectorHit,
        reputation, lpConfidence, dealsLost, firmQualityMod, mandate, lpWarnings,
        firmHistory, lifetimeCarry,
      });

      const hasStartedRef = useRef(false);
      useEffect(() => {
        if (gameState !== 'playing') return;
        if (!hasStartedRef.current) { hasStartedRef.current = true; return; }
        saveGameState(snapshot());
        setHasSave(true);
      }, [quarter]);

      const showToast = (msg, type = 'success') => {
        setSaveToast({ msg, type });
        setTimeout(() => setSaveToast(null), 2200);
      };

      const saveGame = () => {
        if (saveGameState(snapshot())) { showToast('Game saved'); setHasSave(true); }
        else showToast('Save failed', 'error');
      };

      const loadGame = () => {
        const d = loadGameState();
        if (!d) { showToast('No compatible save found', 'error'); return; }
        setFundType(d.fundType); setFundName(d.fundName); setFirmName(d.firmName || d.fundName);
        setFundNumber(d.fundNumber || 1); setFundSize(d.fundSize || baseFundSize(d.fundType));
        setMode(d.mode || 'single'); setThesis(d.thesis || []); setDifficulty(d.difficulty || 'easy');
        setQuarter(d.quarter); setCash(d.cash); setDeployed(d.deployed); setDeployedEver(d.deployedEver || 0);
        setRealized(d.realized || 0); setDistributed(d.distributed || 0); setRecycled(d.recycled || 0);
        setFeesPaid(d.feesPaid || 0); setGpEarnings(d.gpEarnings || 0); setFeeCut(d.feeCut || 0);
        setPortfolio(d.portfolio || []); setFailedCompanies(d.failedCompanies || []);
        setExits(d.exits || []); setDealFlow(d.dealFlow || []); setLog(d.log || []);
        logSeq.current = d.logSeq || (d.log || []).length;
        setUpgrades({ ...EMPTY_UPGRADES, ...(d.upgrades || {}) });
        setMarketCondition(d.marketCondition || 'normal'); setMarketEvent(d.marketEvent || null);
        setEventTurns(d.eventTurns || 0); setSectorBoost(d.sectorBoost || null); setSectorHit(d.sectorHit || null);
        setReputation(d.reputation ?? 50); setLpConfidence(d.lpConfidence ?? 55);
        setDealsLost(d.dealsLost || 0); setFirmQualityMod(d.firmQualityMod || 0);
        setMandate(d.mandate || null); setLpWarnings(d.lpWarnings || 0);
        setFirmHistory(d.firmHistory || []); setLifetimeCarry(d.lifetimeCarry || 0);
        setQueue([]); setNegotiation(null); setIcReview(null); setExitTarget(null);
        setGameState('playing'); setShowSpotlight(false);
        showToast('Game loaded');
      };

      // =====================================================================
      // SETUP
      // =====================================================================

      const startGame = () => {
        const type = pendingFundType;
        const d = DIFFICULTY[pendingDifficulty] || DIFFICULTY.easy;
        const size = baseFundSize(type);
        const name = inputFundName.trim() || (type === 'VC' ? 'Horizon Ventures' : 'Summit Capital');
        usedNames.clear();
        setFundType(type); setDifficulty(pendingDifficulty); setMode(pendingMode);
        setThesis(pendingMode === 'thesis' ? pendingThesis : []);
        setFirmName(name); setFundName(`${name} I`); setFundNumber(1); setFundSize(size);
        setCash(size); setDeployed(0); setDeployedEver(0); setRealized(0); setDistributed(0); setRecycled(0);
        setFeesPaid(0); setGpEarnings(0); setFeeCut(0);
        setQuarter(1); setPortfolio([]); setExits([]); setFailedCompanies([]);
        setUpgrades(EMPTY_UPGRADES); setMarketCondition('normal'); setMarketEvent(null); setEventTurns(0);
        setSectorBoost(null); setSectorHit(null);
        setReputation(d.startRep); setLpConfidence(d.startLP); setDealsLost(0); setFirmQualityMod(0);
        setLpWarnings(0); setFirmHistory([]); setLifetimeCarry(0);
        setMandate(makeMandate(1, size, 0));
        setLog([]); logSeq.current = 0; setQueue([]);
        const th = pendingMode === 'thesis' ? pendingThesis : null;
        const deals = [0, 1, 2].map(() => generateCompany(1, type, {
          marketCondition: 'normal', hotMult: d.hotMult, thesis: th, fundSize: size,
        }));
        setDealFlow(deals);
        setGameState('playing');
        hasStartedRef.current = false;
        setTimeout(() => setShowSpotlight(true), 600);
      };

      // =====================================================================
      // FIRM BUILDING
      // =====================================================================

      const upgradeCost = (track, level) => Math.round(UPGRADES[track].levels[level].c * costScale * 10) / 10;

      const purchaseUpgrade = (track) => {
        const curr = upgrades[track];
        const next = UPGRADES[track].levels[curr + 1];
        if (!next) return;
        const cost = upgradeCost(track, curr + 1);
        if (cash < cost) return;
        setCash(c => c - cost);
        setUpgrades(prev => ({ ...prev, [track]: curr + 1 }));
        addLog(`${UPGRADES[track].name} → ${next.name} (−$${cost.toFixed(1)}M)`, 'success');
        if (track === 'network') setReputation(r => Math.min(100, r + 4));
        if (track === 'irDesk') setLpConfidence(v => Math.min(100, v + 3));
      };

      // =====================================================================
      // DILIGENCE & NEGOTIATION
      // =====================================================================

      const thesisFit = (sector) => thesis && thesis.length > 0 && thesis.includes(sector);

      const ddCostFor = (deal) => getDDCost(fundType, deal.stage, deal.sector, upgrades.ddProgram, diff.ddCostMult, fundSize);

      const conductDD = (deal) => {
        const cost = ddCostFor(deal);
        if (cash < cost) { addLog('Not enough dry powder to run diligence', 'error'); return; }
        setCash(c => c - cost);
        const bonus = (thesisFit(deal.sector) ? 0.09 : 0) + lvl('sourcing').early;
        const findings = generateDD(deal, lvl('ddProgram').acc, bonus);
        setDealFlow(prev => prev.map(d => d.id === deal.id ? { ...d, dueDiligenceComplete: true, ddFindings: findings } : d));
        const flags = [];
        flags.push({ msg: `Diligence on ${deal.name} (−$${cost.toFixed(1)}M)`, type: 'info' });
        if (findings.redFlag) flags.push({ msg: `${deal.name}: ${findings.redFlag}`, type: 'error' });
        if (findings.upside) flags.push({ msg: `${deal.name}: ${findings.upside}`, type: 'success' });
        pushLogs(flags, quarter);
      };

      const getFounderBehavior = (founderType, history = []) => {
        const base = {
          Desperate: { walk: 0.55, aggr: 0.6, patience: 4, vol: 0.15 },
          Reasonable: { walk: 0.35, aggr: 0.8, patience: 3, vol: 0.1 },
          Confident: { walk: 0.22, aggr: 0.9, patience: 2, vol: 0.08 },
          Arrogant: { walk: 0.12, aggr: 0.95, patience: 1, vol: 0.2 },
        }[founderType];
        const frustration = history.length * 0.08;
        const random = (Math.random() - 0.5) * base.vol;
        const edge = lvl('network').founder + lvl('legal').termEdge;
        return {
          walkThreshold: Math.max(0.05, base.walk * diff.founderWalkMult - frustration + random + edge),
          counterAggression: Math.min(0.98, base.aggr + frustration * 0.5),
          patience: Math.max(1, base.patience - history.length),
          volatility: base.vol,
        };
      };

      const startNegotiation = (deal) => {
        if (deal.hasWalked) { addLog(`${deal.name} has already declined to work with you`, 'error'); return; }
        if (deal.isHot && deal.competingFund) {
          const edge = lvl('network').edge + reputation / 220 + (thesisFit(deal.sector) ? 0.1 : 0);
          if (Math.random() < (deal.competingFund.aggressiveness - edge) * 0.5) {
            addLog(`Lost ${deal.name} to ${deal.competingFund.name}`, 'error');
            setDealFlow(prev => prev.filter(d => d.id !== deal.id));
            setDealsLost(n => n + 1);
            setReputation(r => Math.max(0, r - 2));
            return;
          }
        }
        const behavior = getFounderBehavior(deal.founderType, deal.negotiationHistory);
        setNegotiation({
          deal,
          terms: {
            amount: Math.round(deal.ask.amount * 0.85 * 10) / 10,
            multiple: Math.round(deal.ask.multiple * 0.8 * 10) / 10,
            boardSeat: true, proRata: true, leverage: 0,
          },
          mood: 100 - deal.negotiationHistory.length * 15,
          round: deal.negotiationHistory.length + 1,
          maxRounds: behavior.patience + 2,
          msg: deal.negotiationHistory.length === 0
            ? `${deal.founderBg}. Asking $${deal.ask.amount.toFixed(1)}M at ${deal.ask.multiple.toFixed(1)}x ${isVC ? 'revenue' : 'EBITDA'}.`
            : `Back again? We are still at $${deal.ask.amount.toFixed(1)}M and ${deal.ask.multiple.toFixed(1)}x.`,
        });
      };

      const submitOffer = () => {
        if (!negotiation) return;
        const { deal, terms, round, maxRounds, mood } = negotiation;
        const behavior = getFounderBehavior(deal.founderType, deal.negotiationHistory);
        const priceDiscount = 1 - (terms.amount / deal.ask.amount);
        const multDiscount = 1 - (terms.multiple / deal.ask.multiple);
        const avgDiscount = (priceDiscount + multDiscount) / 2;
        const effective = avgDiscount + (Math.random() - 0.5) * behavior.volatility * 2;
        const newHistory = [...deal.negotiationHistory, { round }];

        if (effective > behavior.walkThreshold || round > maxRounds) {
          setDealFlow(prev => prev.map(d => d.id === deal.id ? { ...d, hasWalked: true, negotiationHistory: newHistory } : d));
          setNegotiation(null);
          addLog(`${deal.name} walked away from the process`, 'error');
          setReputation(r => Math.max(0, r - 1));
          return;
        }

        const acceptChance = effective <= 0.08 ? 0.9 : effective <= 0.15 ? 0.42 : effective <= 0.25 ? 0.16 : 0.05;
        if (Math.random() < acceptChance) {
          setNegotiation(null);
          proposeInvestment({ ...deal, negotiationHistory: newHistory }, terms);
          return;
        }

        const strength = behavior.counterAggression + (Math.random() - 0.5) * 0.1;
        const counterAmount = terms.amount + (deal.ask.amount - terms.amount) * strength * 0.6;
        const counterMult = terms.multiple + (deal.ask.multiple - terms.multiple) * strength * 0.5;
        const counterMsgs = {
          Desperate: ['We need at least this to keep the lights on.', 'Please — can you get closer?', 'We are flexible, but not that flexible.'],
          Reasonable: ['Let us meet nearer the middle.', 'We can work with something like this.', 'A little more and we have a deal.'],
          Confident: ['We know what this is worth.', 'Two other funds are in the process.', 'That is our floor.'],
          Arrogant: ['Take it or leave it.', 'We do not discount.', 'This is the last conversation.'],
        };
        setDealFlow(prev => prev.map(d => d.id === deal.id ? { ...d, negotiationHistory: newHistory } : d));
        setNegotiation(prev => ({
          ...prev,
          round: round + 1,
          mood: Math.max(10, mood - avgDiscount * 60 - 10),
          counter: { amount: Math.round(counterAmount * 10) / 10, multiple: Math.round(counterMult * 10) / 10 },
          msg: pick(counterMsgs[deal.founderType]),
        }));
      };

      const acceptCounter = () => {
        if (!negotiation || !negotiation.counter) return;
        const terms = { ...negotiation.terms, amount: negotiation.counter.amount, multiple: negotiation.counter.multiple };
        const deal = negotiation.deal;
        setNegotiation(null);
        proposeInvestment(deal, terms);
      };

      const walkFromNegotiation = () => {
        if (!negotiation) return;
        addLog(`Walked away from ${negotiation.deal.name}`, 'info');
        setNegotiation(null);
      };

      // =====================================================================
      // INVESTMENT COMMITTEE & INVESTING
      // =====================================================================

      const equityCheque = (terms) => terms.amount * (1 - (terms.leverage || 0));

      const proposeInvestment = (deal, terms) => {
        const equity = equityCheque(terms);
        if (cash < equity) { addLog(`Not enough dry powder for ${deal.name}`, 'error'); return; }
        if (equity / fundSize > diff.icThreshold) {
          const withEquity = { ...terms, equity };
          setIcReview({ deal, terms: withEquity, result: evaluateIC(deal, withEquity, { fundSize, portfolio, deployed, thesis, reputation, icThreshold: diff.icThreshold, isVC }) });
          return;
        }
        invest(deal, terms);
      };

      const invest = (deal, terms) => {
        const equity = equityCheque(terms);
        const debt = terms.amount - equity;
        if (cash < equity) { addLog('Insufficient dry powder', 'error'); return; }
        const ownership = isVC
          ? (terms.amount / (terms.amount + deal.metrics.revenue * terms.multiple)) * 100
          : Math.min(100, deal.stakeFraction * 100);
        const inv = {
          id: deal.id, name: deal.name, sector: deal.sector, stage: deal.stage,
          moat: deal.moat, model: deal.model, founderBg: deal.founderBg,
          metrics: deal.metrics, trueQuality: deal.trueQuality,
          investedAmount: equity, enterprisePaid: terms.amount, investedMultiple: terms.multiple,
          boardSeat: terms.boardSeat, proRata: terms.proRata,
          debt, assetValue: terms.amount, currentValue: equity,
          ownership, quarterInvested: quarter, status: 'active', addOns: 0,
          hadDD: deal.dueDiligenceComplete,
        };
        setPortfolio(prev => [...prev, inv]);
        setCash(c => c - equity);
        setDeployed(d => d + equity);
        setDeployedEver(d => d + equity);
        setDealFlow(prev => prev.filter(d => d.id !== deal.id));
        const levNote = debt > 0.05 ? ` with $${debt.toFixed(1)}M of debt` : '';
        addLog(`Invested $${equity.toFixed(1)}M in ${deal.name}${levNote}`, 'success');
        setReputation(r => Math.min(100, r + 2));
      };

      const resolveIC = (approve) => {
        if (!icReview) return;
        const { deal, terms, result } = icReview;
        setIcReview(null);
        if (approve && result.approved) {
          invest(deal, terms);
        } else if (!result.approved) {
          addLog(`IC declined ${deal.name} (${result.yes} of 3 in favour)`, 'warning');
        }
      };

      const passDeal = (deal) => {
        setDealFlow(prev => prev.filter(d => d.id !== deal.id));
        addLog(`Passed on ${deal.name}`, 'info');
      };

      // =====================================================================
      // EXITS
      // =====================================================================

      const routeAvailable = (route, inv) => {
        if (route.key === 'ipo') return inv.currentValue > fundSize * 0.06 && marketCondition !== 'downturn';
        if (route.key === 'sponsor') return !isVC || inv.currentValue > fundSize * 0.02;
        return true;
      };

      const exitOdds = (route, inv) => {
        const hold = quarter - inv.quarterInvested;
        const sectorIpo = SECTORS[inv.sector].ipo;
        const base = (inv.trueQuality * 0.5 + Math.min(hold, 24) / 40 * 0.3 + 0.1)
          * market.exitModifier * diff.exitMult
          * (route.key === 'ipo' ? sectorIpo : 1)
          * route.probMod
          + lvl('capMarkets').exitProb;
        return clamp(base, 0.03, 0.94);
      };

      // Sale proceeds are struck on the whole business; any debt is repaid out
      // of them first, and only what is left belongs to the equity. That is why
      // leverage magnifies the return on a good exit and destroys a poor one.
      const exitFactor = (route, inv) =>
        (0.80 + Math.random() * 0.30 + inv.trueQuality * 0.25)
        * market.exitModifier * diff.exitMult * route.priceMod
        * (1 + lvl('opsPartners').exitLift) * (1 + (inv.addOns || 0) * 0.04);

      const exitPrice = (route, inv) => {
        const gross = (inv.assetValue != null ? inv.assetValue : inv.currentValue) * exitFactor(route, inv);
        return Math.max(0, gross - (inv.debt || 0));
      };

      const executeExit = (inv, route) => {
        setExitTarget(null);
        if (route.key === 'secondary') {
          const proceeds = Math.max(0, exitPrice(route, inv) * 0.85);
          bookExit(inv, proceeds, 'Secondary sale');
          return;
        }
        if (Math.random() < exitOdds(route, inv)) {
          bookExit(inv, Math.max(0, exitPrice(route, inv)), route.name);
        } else {
          addLog(`${route.name} process for ${inv.name} failed to clear — no acceptable bid`, 'error');
          setPortfolio(prev => prev.map(p => p.id === inv.id
            ? { ...p, assetValue: p.assetValue * 0.97, currentValue: Math.max(0, p.assetValue * 0.97 - p.debt) }
            : p));
        }
      };

      const bookExit = (inv, proceeds, routeName) => {
        const toCash = Math.min(proceeds, recycleRoom);
        const toLPs = proceeds - toCash;
        setCash(c => c + toCash);
        setRecycled(r => r + toCash);
        setDistributed(d => d + toLPs);
        setDeployed(d => d - inv.investedAmount);
        setRealized(r => r + proceeds);
        setExits(prev => [...prev, { ...inv, exitValue: proceeds, exitMOIC: proceeds / inv.investedAmount, route: routeName, quarterExited: quarter }]);
        setPortfolio(prev => prev.filter(p => p.id !== inv.id));
        const m = proceeds / inv.investedAmount;
        addLog(`${routeName}: ${inv.name} at ${m.toFixed(2)}x (+$${proceeds.toFixed(1)}M)`, m >= 1 ? 'success' : 'warning');
        setReputation(r => clamp(r + (m >= 3 ? 6 : m >= 1.5 ? 3 : m >= 1 ? 1 : -2), 0, 100));
        setLpConfidence(v => clamp(v + (m >= 2 ? 5 : m >= 1 ? 2 : -1), 0, 100));
      };

      // =====================================================================
      // QUEUED DECISIONS
      // =====================================================================

      const enqueue = (item) => setQueue(q => [...q, item]);
      const current = queue[0] || null;
      const shift = () => setQueue(q => q.slice(1));

      const handlePortfolioDecision = (idx) => {
        if (!current || current.kind !== 'decision') return;
        const { company, event } = current.payload;
        const choice = event.choices[idx];
        const logs = [];
        if (choice.effect.cost && cash >= choice.effect.cost) setCash(c => c - choice.effect.cost);
        if (choice.effect.forceExit) {
          const proceeds = company.investedAmount * choice.effect.forceExit;
          shift();
          bookExit(company, proceeds, 'Strategic acquisition');
          return;
        }
        let failed = false;
        if (choice.effect.failRisk && Math.random() < choice.effect.failRisk * diff.failMult) failed = true;
        if (failed) {
          setPortfolio(prev => prev.filter(p => p.id !== company.id));
          setDeployed(d => d - company.investedAmount);
          setFailedCompanies(prev => [...prev, { ...company, failReason: event.title }]);
          logs.push({ msg: `${company.name} failed after ${event.title.toLowerCase()}`, type: 'error' });
        } else {
          const mod = choice.effect.valueMod || 1;
          setPortfolio(prev => prev.map(p => p.id === company.id
            ? { ...p, assetValue: p.assetValue * mod, currentValue: Math.max(0, p.assetValue * mod - p.debt) }
            : p));
          logs.push({ msg: `${company.name}: ${choice.outcome}`, type: mod >= 1 ? 'success' : 'warning' });
        }
        pushLogs(logs, quarter);
        shift();
      };

      const handleFollowOn = (participate) => {
        if (!current || current.kind !== 'followon') return;
        const { company, scenario, proRataAmount } = current.payload;
        if (participate) {
          if (cash < proRataAmount) { addLog('Not enough dry powder for the pro-rata', 'error'); shift(); return; }
          setCash(c => c - proRataAmount);
          setDeployed(d => d + proRataAmount);
          setDeployedEver(d => d + proRataAmount);
          setPortfolio(prev => prev.map(p => p.id === company.id ? {
            ...p,
            assetValue: p.assetValue * (scenario.isDown ? 0.75 : 1.3) + proRataAmount,
            currentValue: Math.max(0, p.assetValue * (scenario.isDown ? 0.75 : 1.3) + proRataAmount - p.debt),
            investedAmount: p.investedAmount + proRataAmount,
          } : p));
          addLog(`Followed on into ${company.name} (−$${proRataAmount.toFixed(1)}M)`, 'success');
        } else {
          setPortfolio(prev => prev.map(p => p.id === company.id ? {
            ...p,
            ownership: p.ownership * (scenario.isDown ? 0.5 : 0.85),
            assetValue: p.assetValue * (scenario.isDown ? 0.6 : 1.05),
            currentValue: Math.max(0, p.assetValue * (scenario.isDown ? 0.6 : 1.05) - p.debt),
          } : p));
          addLog(`Took dilution in ${company.name}`, scenario.isDown ? 'error' : 'warning');
        }
        shift();
      };

      const handleAddOn = (accept) => {
        if (!current || current.kind !== 'addon') return;
        const { company, cost, uplift, integrationRisk } = current.payload;
        if (accept) {
          if (cash < cost) { addLog('Not enough dry powder for the add-on', 'error'); shift(); return; }
          setCash(c => c - cost);
          setDeployed(d => d + cost);
          setDeployedEver(d => d + cost);
          const messy = Math.random() < integrationRisk;
          const factor = messy ? 1 + uplift * 0.25 : 1 + uplift;
          setPortfolio(prev => prev.map(p => p.id === company.id ? {
            ...p,
            assetValue: p.assetValue * factor + cost,
            currentValue: Math.max(0, p.assetValue * factor + cost - p.debt),
            investedAmount: p.investedAmount + cost,
            addOns: (p.addOns || 0) + 1,
          } : p));
          addLog(messy
            ? `Add-on completed at ${company.name}, but integration is going badly`
            : `Add-on acquisition folded into ${company.name}`, messy ? 'warning' : 'success');
        } else {
          addLog(`Passed on the add-on for ${company.name}`, 'info');
        }
        shift();
      };

      const handleFirmEvent = (idx) => {
        if (!current || current.kind !== 'firm') return;
        const ev = current.payload;
        const choice = ev.choices[idx];
        const e = choice.effect;
        const logs = [{ msg: `${ev.title}: ${choice.outcome}`, type: e.lp && e.lp < 0 ? 'warning' : 'info' }];
        if (e.cash) setCash(c => c + e.cash);
        if (e.cashPct) setCash(c => c + fundSize * e.cashPct);
        if (e.rep) setReputation(r => clamp(r + e.rep, 0, 100));
        if (e.lp) setLpConfidence(v => clamp(v + e.lp, 0, 100));
        if (e.feeCut) setFeeCut(f => Math.min(0.6, f + e.feeCut));
        if (e.quality) setFirmQualityMod(q => clamp(q + e.quality, -0.12, 0.12));
        if (e.markdown) {
          setPortfolio(prev => prev.map(p => ({ ...p, assetValue: p.assetValue * e.markdown, currentValue: Math.max(0, p.assetValue * e.markdown - p.debt) })));
          logs.push({ msg: 'Portfolio marked down across the book', type: 'warning' });
        }
        if (e.mandateDPI) {
          setMandate({ id: 'dpi', target: Math.max(0.3, dpi + 0.25), deadline: Math.min(FUND_LIFE_Q, quarter + 8), issued: quarter });
          logs.push({ msg: 'LPs have set a new distribution target', type: 'warning' });
        }
        pushLogs(logs, quarter);
        shift();
      };

      const handleLPMeeting = (idx) => {
        if (!current || current.kind !== 'lp') return;
        const { choices } = current.payload;
        const c = choices[idx];
        if (c.lp) setLpConfidence(v => clamp(v + c.lp, 0, 100));
        if (c.rep) setReputation(r => clamp(r + c.rep, 0, 100));
        if (c.feeCut) setFeeCut(f => Math.min(0.6, f + c.feeCut));
        if (c.mandateDPI) setMandate({ id: 'dpi', target: Math.max(0.3, dpi + 0.25), deadline: Math.min(FUND_LIFE_Q, quarter + 8), issued: quarter });
        addLog(`Annual meeting: ${c.outcome}`, c.lp >= 0 ? 'success' : 'warning');
        shift();
      };

      // =====================================================================
      // QUARTER ADVANCE
      // Everything that happens between quarters is computed here, in order,
      // and logged into a single buffer that is flushed once at the end. No
      // logging happens inside a state updater, which is what previously let
      // entries land out of order.
      // =====================================================================

      const advanceQuarter = () => {
        if (queue.length || negotiation || icReview || exitTarget) return;
        if (quarter >= FUND_LIFE_Q) { closeFund(false); return; }

        const nextQ = quarter + 1;
        const L = [];
        const lg = (msg, type = 'info') => L.push({ msg, type });
        const newItems = [];

        const port = lvl('platform');
        const ops = lvl('opsPartners');
        const legalRec = lvl('legal').recovery;

        // ---- 1. firm P&L -------------------------------------------------
        let cashDelta = -quarterlyDrag;
        setFeesPaid(f => f + quarterlyDrag);
        setGpEarnings(g => g + feeSurplus);
        // Only flag the fee/opex gap when it is actually eating into the fund.
        if (quarterlyOpex - feeIncome > fundSize * 0.0015) {
          lg(`Running costs $${quarterlyOpex.toFixed(2)}M against $${feeIncome.toFixed(2)}M of fee income — the shortfall comes out of investable capital`, 'warning');
        }

        // ---- 2. market ---------------------------------------------------
        let newMarket = marketCondition;
        let newEventTurns = eventTurns - 1;
        if (newEventTurns <= 0 && marketEvent) {
          setMarketEvent(null); setSectorBoost(null); setSectorHit(null);
          newMarket = 'normal';
          lg('Market conditions normalised', 'info');
        }
        let nextBoost = newEventTurns > 0 ? sectorBoost : null;
        let nextHit = newEventTurns > 0 ? sectorHit : null;
        if (!marketEvent && Math.random() < diff.eventFreq) {
          const ev = pick(MACRO_EVENTS);
          setMarketEvent(ev); setEventTurns(ev.duration); newEventTurns = ev.duration;
          newMarket = ev.effect;
          nextBoost = ev.sectorBoost || null;
          nextHit = ev.sectorHit || null;
          setSectorBoost(nextBoost);
          setSectorHit(nextHit);
          const touches = (ev.sectorBoost && thesisFit(ev.sectorBoost)) || (ev.sectorHit && thesisFit(ev.sectorHit));
          lg(`${ev.icon} ${ev.text}${ev.sectorBoost ? ` — ${ev.sectorBoost} bid up` : ''}${ev.sectorHit ? ` — ${ev.sectorHit} hit` : ''}${touches ? ' (inside your thesis)' : ''}`,
            ev.effect === 'downturn' ? 'warning' : 'success');
        }
        setMarketCondition(newMarket);
        setEventTurns(newEventTurns);
        const nextMarket = MARKET_CONDITIONS[newMarket];

        // ---- 3. deal flow ages -------------------------------------------
        const nextDeals = [];
        dealFlow.forEach(d => {
          if (d.hasWalked) return;
          if (d.turnsToDecide !== null && d.turnsToDecide !== undefined) {
            const t = d.turnsToDecide - 1;
            if (t <= 0) { lg(`${d.name} signed with ${d.competingFund ? d.competingFund.name : 'another investor'}`, 'warning'); return; }
            nextDeals.push({ ...d, turnsToDecide: t });
            return;
          }
          if (d.quarterAppeared && (nextQ - d.quarterAppeared) >= 3) {
            lg(`${d.name} went cold and stopped returning calls`, 'info');
            return;
          }
          nextDeals.push(d);
        });

        // ---- 4. portfolio ------------------------------------------------
        const failures = [];
        let recoveries = 0;
        let addOnOffered = false;
        const updated = [];

        portfolio.forEach(inv => {
          const S = SECTORS[inv.sector];
          const q = inv.trueQuality;
          const sMod = nextBoost === inv.sector ? 1.16 : nextHit === inv.sector ? 0.86 : 1;
          const thesisLift = thesisFit(inv.sector) ? 1.3 : 1;
          const holdSoFar = nextQ - inv.quarterInvested;
          const opsMargin = ops.margin * (isVC ? 0.5 : 1);
          // Value tracks revenue growth, but growth rates fade as a company
          // matures and only good companies come close to their plan. Weak
          // companies grind sideways or shrink no matter what they projected.
          const fade = Math.pow(0.93, holdSoFar);
          const execution = clamp((q - 0.25) * 1.5, -0.35, 1.1);
          const effAnnual = Math.max(-45, inv.metrics.growth) * fade * execution * diff.growthMult;
          const growthFactor = Math.pow(1 + Math.max(-0.6, effAnnual / 100), 0.25);
          const base = growthFactor + port.boost * thesisLift + opsMargin;
          const noise = (Math.random() - 0.5) * 0.22;
          let newAsset = inv.assetValue * Math.max(0.35, base + noise)
            * (1 + (nextMarket.multipleModifier - 1) * 0.35) * sMod;

          // Debt: interest accrues, cash sweep pays it down. Deleveraging is a
          // real PE return lever — and a real risk when the asset stalls.
          let newDebt = inv.debt || 0;
          if (newDebt > 0) {
            const rate = 0.021 * nextMarket.debtCost * lvl('capMarkets').debtCost;
            const sweep = Math.max(0, newAsset * 0.013);
            newDebt = Math.max(0, newDebt + newDebt * rate - sweep);
          }

          // Company events
          let eventFired = false;
          if (Math.random() < 0.11) {
            const pool = PORTFOLIO_EVENTS.filter(e => {
              if (e.leveredOnly && !(inv.debt > 0)) return false;
              if (e.sectorReg && S.reg < e.sectorReg) return false;
              if (e.type === 'event') return q < 0.5 ? !e.isPositive || Math.random() < 0.3 : true;
              return true;
            });
            const ev = pool.length ? pick(pool) : null;
            if (ev && ev.type === 'decision' && !newItems.some(i => i.kind === 'decision')) {
              newItems.push({ kind: 'decision', payload: { company: { ...inv, assetValue: newAsset, debt: newDebt }, event: ev } });
              eventFired = true;
            } else if (ev && ev.type === 'event') {
              lg(`${inv.name} ${ev.text}`, ev.isPositive ? 'success' : 'warning');
              newAsset *= ev.valueMod;
              if (ev.failRisk && Math.random() < ev.failRisk * (1 - port.failCut) * diff.failMult) {
                failures.push({ ...inv, failReason: ev.text });
                recoveries += inv.investedAmount * legalRec;
                return;
              }
            }
          }
          if (eventFired) { updated.push({ ...inv, assetValue: newAsset, debt: newDebt, currentValue: Math.max(0, newAsset - newDebt) }); return; }

          // Covenant test
          if (newDebt > 0 && newDebt > newAsset * 0.88) {
            lg(`${inv.name} is close to breaching its leverage covenant`, 'warning');
            if (Math.random() < 0.22 * diff.failMult) {
              failures.push({ ...inv, failReason: 'Lender took control after a covenant breach' });
              recoveries += inv.investedAmount * legalRec * 0.5;
              return;
            }
          }

          // Baseline failure risk
          const leverStress = newAsset > 0 ? 1 + (newDebt / newAsset) * 0.9 : 1;
          const failChance = (1 - q) * 0.023 * (isVC ? 1.5 : 0.55) * S.fail
            * (1 - port.failCut) * diff.failMult * leverStress;
          if (Math.random() < failChance) {
            failures.push({ ...inv, failReason: isVC ? 'Ran out of runway' : 'Trading deteriorated past the point of rescue' });
            recoveries += inv.investedAmount * legalRec;
            return;
          }

          const hold = holdSoFar;

          // Follow-on rounds
          if (inv.proRata && hold > 4 && hold % 6 === 0 && Math.random() < 0.18 && !newItems.some(i => i.kind === 'followon')) {
            const sc = pick(Math.random() < 0.28 ? FOLLOWON_SCENARIOS.slice(1) : [FOLLOWON_SCENARIOS[0]]);
            const amt = Math.max(0.2, (inv.ownership / 100) * (isVC ? 6 : 25) * costScale * (sc.isDown ? 0.5 : 1));
            newItems.push({ kind: 'followon', payload: {
              company: inv, scenario: sc,
              proRataAmount: Math.round(amt * 10) / 10,
              newValuation: (newAsset - newDebt) * (sc.isDown ? 0.6 : 1.8),
            } });
          }

          // Add-on acquisitions for platform assets
          const isPlatform = !isVC && (inv.stage === 'Buyout' || inv.stage === 'Carve-out');
          if (isPlatform && !addOnOffered && hold >= 3 && (inv.addOns || 0) < 4
              && Math.random() < 0.06 + ops.addOn * 0.14) {
            addOnOffered = true;
            const cost = Math.round(Math.max(0.5, (newAsset - newDebt) * between([0.12, 0.3])) * 10) / 10;
            newItems.push({ kind: 'addon', payload: {
              company: inv, cost,
              uplift: 0.18 + ops.addOn * 0.22,
              integrationRisk: clamp(0.45 - ops.addOn * 0.5, 0.08, 0.45),
            } });
          }

          updated.push({ ...inv, assetValue: newAsset, debt: newDebt, currentValue: Math.max(0, newAsset - newDebt) });
        });

        if (failures.length) {
          setFailedCompanies(prev => [...prev, ...failures]);
          setDeployed(d => d - failures.reduce((a, f) => a + f.investedAmount, 0));
          failures.forEach(f => lg(`${f.name} written off — ${f.failReason.toLowerCase()}`, 'error'));
          setReputation(r => Math.max(0, r - failures.length));
        }
        if (recoveries > 0.05) {
          setDistributed(d => d + recoveries);
          setRealized(r => r + recoveries);
          lg(`Recovered $${recoveries.toFixed(1)}M through liquidation preferences`, 'info');
        }
        setPortfolio(updated);

        // ---- 5. new deals ------------------------------------------------
        const flowBonus = lvl('network').flow;
        const count = getNewDealCount(nextQ, newMarket, flowBonus, lvl('sourcing').extra, diff.dealFlowMult);
        if (count === 0) {
          lg('Nothing worth looking at came in this quarter', 'info');
        } else {
          const fresh = Array.from({ length: count }, () => generateCompany(nextQ, fundType, {
            qualityBonus: lvl('analyst').quality + lvl('sourcing').early + firmQualityMod,
            marketCondition: newMarket,
            sectorBoost: nextBoost, sectorHit: nextHit,
            hotMult: diff.hotMult,
            thesis: thesis && thesis.length ? thesis : null,
            proprietary: lvl('sourcing').proprietary,
            fundSize,
          }));
          fresh.forEach(f => nextDeals.push(f));
          lg(`${count} new ${count > 1 ? 'opportunities' : 'opportunity'} in the pipeline`, 'info');
        }
        setDealFlow(nextDeals);

        // ---- 6. LP relationship ------------------------------------------
        let lpDelta = lvl('irDesk').patience * 0.7;
        const expectedDpi = Math.max(0, (nextQ - 12) / 28) * 0.85;
        if (nextQ > 12 && dpi < expectedDpi) {
          lpDelta -= clamp((expectedDpi - dpi) * 7, 0, 4.5) * diff.lpDecay * (1 - lvl('irDesk').patience);
        }
        lpDelta += tvpi > 1.35 ? 0.8 : tvpi < 0.85 ? -1.1 * diff.lpDecay : 0;

        // Mandate resolution
        if (mandate && nextQ >= mandate.deadline) {
          const met = evaluateMandate(mandate, { dpi, tvpi, portfolio: updated, fundSize, deployedEver });
          const type = MANDATE_TYPES.find(t => t.id === mandate.id);
          if (met) {
            lpDelta += 9;
            setReputation(r => Math.min(100, r + 3));
            lg(`LP objective met — ${type.label(mandate.target)}`, 'success');
          } else {
            lpDelta -= 11 * diff.lpDecay;
            lg(`LP objective missed — ${type.label(mandate.target)}`, 'error');
          }
          setMandate(nextQ < FUND_LIFE_Q - 3 ? makeMandate(nextQ, fundSize, updated.length) : null);
        }

        const newLp = clamp(lpConfidence + lpDelta, 0, 100);
        setLpConfidence(newLp);
        if (newLp < 20) {
          const warn = lpWarnings + 1;
          setLpWarnings(warn);
          lg(warn >= 3
            ? 'LPs are formally reviewing whether to terminate the investment period'
            : 'LP confidence is low. The advisory committee wants an explanation.', 'error');
          if (warn >= 4) {
            pushLogs(L, nextQ);
            setQuarter(nextQ);
            closeFund(false, 'LPs terminated the fund early');
            return;
          }
        } else if (lpWarnings > 0 && newLp > 32) {
          setLpWarnings(0);
        }

        // ---- 7. firm-level events ----------------------------------------
        if (Math.random() < diff.firmEventFreq && !newItems.some(i => i.kind === 'firm')) {
          newItems.push({ kind: 'firm', payload: pick(FIRM_EVENTS) });
        }

        // Annual LP meeting every two years
        if (nextQ % 8 === 0 && nextQ < FUND_LIFE_Q) {
          newItems.push({ kind: 'lp', payload: {
            title: `Annual General Meeting — Year ${nextQ / 4}`,
            body: `Your LPs have the numbers in front of them: ${tvpi.toFixed(2)}x TVPI, ${dpi.toFixed(2)}x DPI, ${updated.length} active positions and $${Math.max(0, cash + cashDelta).toFixed(0)}M of dry powder left. They want to know what happens next.`,
            choices: [
              { text: 'Commit to returning capital sooner', lp: 8, rep: -1, outcome: 'You promised distributions. Now you have to find them.', mandateDPI: true },
              { text: 'Argue for holding the winners longer', lp: -4, rep: 3, outcome: 'Conviction stated. The clock keeps running.' },
              { text: 'Offer a fee concession to buy goodwill', lp: 11, feeCut: 0.2, outcome: 'Fees cut. The room warmed considerably.' },
            ],
          } });
        }

        setCash(c => Math.max(0, c + cashDelta));
        if (newItems.length) setQueue(q => [...q, ...newItems]);
        pushLogs(L, nextQ);
        setQuarter(nextQ);
      };

      // =====================================================================
      // FUND CLOSE, CARRY AND SUCCESSOR FUNDS
      // =====================================================================

      const HURDLE_MULTIPLE = Math.pow(1.08, FUND_LIFE_Q / 4);

      const buildResult = (extra = {}) => {
        const liquidation = extra.liquidationDiscount || 1;
        const navNow = portfolio.reduce((a, p) => a + p.currentValue * liquidation, 0);
        const returned = cash + navNow + distributed;
        const moic = fundSize > 0 ? returned / fundSize : 0;
        const profit = returned - fundSize;
        const carry = (moic >= HURDLE_MULTIPLE && profit > 0) ? profit * 0.2 : 0;
        const outcomes = [
          ...exits.map(e => ({ name: e.name, moic: e.exitMOIC, type: 'exit', sector: e.sector })),
          ...failedCompanies.map(f => ({ name: f.name, moic: 0, type: 'failed', sector: f.sector })),
          ...portfolio.map(p => ({ name: p.name, moic: (p.currentValue * liquidation) / p.investedAmount, type: 'held', sector: p.sector })),
        ];
        const best = outcomes.length ? outcomes.reduce((a, b) => (a.moic > b.moic ? a : b)) : null;
        const worst = outcomes.length ? outcomes.reduce((a, b) => (a.moic < b.moic ? a : b)) : null;
        return {
          fundName, fundNumber, fundSize, moic, target: targetMOIC, returned, navNow,
          dpi: distributed / Math.max(fundSize, 1), tvpi: moic, carry, feesPaid, realized,
          exits: exits.length, failures: failedCompanies.length, held: portfolio.length, gpEarnings,
          dealsLost, bestInv: best, worstInv: worst, quarter,
          won: moic >= targetMOIC, lpConfidence, reputation,
          ...extra,
        };
      };

      const closeFund = (early, reason) => {
        const result = buildResult(early ? { earlyRetirement: true, liquidationDiscount: 0.7, reason } : { reason });
        setLifetimeCarry(c => c + result.carry);
        setFirmHistory(h => [...h, {
          fundNumber, fundName, fundSize, moic: result.moic, dpi: result.dpi, carry: result.carry,
        }]);
        if (mode === 'firm' && !early) {
          setFundClose(result);
          setGameState('fundclose');
        } else {
          deleteSave(); setHasSave(false);
          setGameOver(result);
          setGameState('over');
        }
      };

      const raiseAppetite = () => {
        if (!fundClose) return { score: 0, sizeMult: 0 };
        const perf = clamp(fundClose.dpi, 0, 2) * 0.55 + clamp(fundClose.moic / targetMOIC, 0, 2) * 0.45;
        const score = clamp(perf * 46 + lpConfidence * 0.38 + reputation * 0.16 + lvl('irDesk').raise * 28, 0, 130);
        const sizeMult = score < 34 ? 0 : score < 52 ? 0.7 : score < 72 ? 1.15 : score < 92 ? 1.55 : 2.1;
        return { score, sizeMult };
      };

      const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];

      const raiseNextFund = (rollOver) => {
        const { sizeMult } = raiseAppetite();
        if (sizeMult === 0) return;
        const newSize = Math.max(25, Math.round(fundSize * sizeMult));
        const n = fundNumber + 1;
        const carried = rollOver ? portfolio : [];
        const rollPrice = Math.min(carried.reduce((a, p) => a + p.currentValue * 0.88, 0), newSize * 0.6);

        setFundNumber(n);
        setFundSize(newSize);
        setFundName(`${firmName} ${ROMAN[Math.min(n - 1, ROMAN.length - 1)]}`);
        setCash(newSize - rollPrice);
        setPortfolio(carried.map(p => ({
          ...p, quarterInvested: 1, investedAmount: p.currentValue * 0.88,
          assetValue: p.assetValue, debt: p.debt, currentValue: p.currentValue,
        })));
        setDeployed(rollPrice);
        setDeployedEver(rollPrice);
        setRealized(0); setDistributed(0); setRecycled(0); setFeesPaid(0); setFeeCut(0);   // GP earnings carry across funds
        setExits([]); setFailedCompanies([]);
        setQuarter(1);
        setMarketCondition('normal'); setMarketEvent(null); setEventTurns(0);
        setSectorBoost(null); setSectorHit(null);
        setLpConfidence(clamp(45 + (fundClose.moic - targetMOIC) * 18, 22, 88));
        setLpWarnings(0);
        setMandate(makeMandate(1, newSize, carried.length));
        setQueue([]);
        setDealFlow([0, 1, 2].map(() => generateCompany(1, fundType, {
          qualityBonus: lvl('analyst').quality + firmQualityMod,
          marketCondition: 'normal', hotMult: diff.hotMult,
          thesis: thesis && thesis.length ? thesis : null,
          proprietary: lvl('sourcing').proprietary, fundSize: newSize,
        })));
        setLog([]); logSeq.current = 0;
        pushLogs([
          { msg: `${firmName} ${ROMAN[Math.min(n - 1, ROMAN.length - 1)]} closed at $${newSize}M`, type: 'success' },
          rollOver && carried.length
            ? { msg: `${carried.length} position${carried.length > 1 ? 's' : ''} rolled into a continuation vehicle at 88% of carrying value`, type: 'info' }
            : null,
        ].filter(Boolean), 1);
        setFundClose(null);
        setGameState('playing');
        hasStartedRef.current = false;
      };

      const endFirm = () => {
        const result = { ...fundClose, firmOver: true, firmHistory: [...firmHistory], lifetimeCarry };
        deleteSave(); setHasSave(false);
        setFundClose(null);
        setGameOver(result);
        setGameState('over');
      };

      const retireEarly = () => { setShowRetireConfirm(false); closeFund(true); };

      const resetGame = () => {
