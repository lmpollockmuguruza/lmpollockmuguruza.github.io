        setGameState('intro'); setGameOver(null); setFundClose(null);
        setShowSpotlight(false); setSpotlightStep(0);
        setPendingFundType(null); setPendingDifficulty('easy'); setPendingMode('single');
        setPendingThesis([]); setSetupStep('type'); setInputFundName('');
        setHasSave(hasSavedGame());
      };

      // =====================================================================
      // RENDER — INTRO
      // =====================================================================

      if (gameState === 'intro') {
        const saved = hasSave ? loadGameState() : null;
        return (
          <div style={s.app}>
            <div style={s.intro}>
              <div style={{ fontSize: '48px', marginBottom: '24px' }}>📊</div>
              <div style={{ fontSize: '11px', fontWeight: '600', letterSpacing: '0.15em', textTransform: 'uppercase', color: '#999', marginBottom: '16px' }}>Private Markets Simulator</div>
              <h1 style={s.introTitle}>Fund Strategy</h1>
              <p style={s.introSub}>Run a venture or private equity fund. Source deals across {SECTOR_KEYS.length} verticals, survive the investment committee, build the firm around you, keep your LPs — and do it again with the next fund.</p>
              <div style={{ display: 'flex', gap: '12px', alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center' }}>
                <button style={{ ...s.btn, padding: '14px 32px', fontSize: '14px' }} onClick={() => { setSetupStep('type'); setGameState('setup'); }}>New Fund</button>
                {saved && <button style={{ ...s.btnSec, padding: '14px 32px', fontSize: '14px' }} onClick={loadGame}>Continue ↗</button>}
                <button style={{ ...s.btnSec, padding: '14px 32px', fontSize: '14px' }} onClick={() => setShowAcademy(true)}>📚 Learn</button>
                <button style={{ ...s.btnSec, padding: '14px 32px', fontSize: '14px' }} onClick={() => setShowSectors(true)}>🗂 Verticals</button>
              </div>
              <p style={{ fontSize: '12px', color: '#aaa', marginTop: '16px', maxWidth: '440px', lineHeight: 1.5 }}>
                New to venture capital and private equity? Open <strong style={{ color: '#888' }}>📚 Learn</strong> for a plain-language crash course covering everything the game models.
              </p>
              {showAcademy && <AcademyModal onClose={() => setShowAcademy(false)} />}
              {showSectors && <SectorGuideModal onClose={() => setShowSectors(false)} fundType="VC" thesis={null} />}
              {saved && (
                <div style={{ marginTop: '16px', fontSize: '11px', color: '#999', lineHeight: 1.5 }}>
                  Saved: <strong style={{ color: '#666' }}>{saved.fundName}</strong> · {(DIFFICULTY[saved.difficulty] || DIFFICULTY.easy).label} · Q{saved.quarter}/{FUND_LIFE_Q} · {new Date(saved.savedAt).toLocaleDateString()}
                </div>
              )}
              <div style={s.introFeatures}>
                <div style={s.introFeature}><div style={{ fontSize: '24px', marginBottom: '8px' }}>🎯</div><div style={{ fontSize: '12px', color: '#666' }}>Source across verticals</div></div>
                <div style={s.introFeature}><div style={{ fontSize: '24px', marginBottom: '8px' }}>📋</div><div style={{ fontSize: '12px', color: '#666' }}>Survive the IC</div></div>
                <div style={s.introFeature}><div style={{ fontSize: '24px', marginBottom: '8px' }}>🏛️</div><div style={{ fontSize: '12px', color: '#666' }}>Build the firm</div></div>
                <div style={s.introFeature}><div style={{ fontSize: '24px', marginBottom: '8px' }}>🤝</div><div style={{ fontSize: '12px', color: '#666' }}>Keep your LPs</div></div>
              </div>
            </div>
          </div>
        );
      }

      // =====================================================================
      // RENDER — SETUP
      // =====================================================================

      if (gameState === 'setup') {
        if (setupStep === 'type') {
          return (
            <div style={s.app}>
              <div style={s.setup}>
                <h1 style={{ fontSize: 'clamp(28px, 7vw, 40px)', fontWeight: '600', marginBottom: '12px' }}>Choose Your Fund</h1>
                <p style={{ fontSize: '15px', color: '#666', marginBottom: '40px', maxWidth: '420px' }}>Each fund type has different cheque sizes, return targets, hold periods and risk profiles.</p>
                <div style={s.fundGrid}>
                  <button onClick={() => { setPendingFundType('VC'); setSetupStep('difficulty'); }} style={s.fundCard} onMouseOver={e => e.currentTarget.style.borderColor = '#0a0a0a'} onMouseOut={e => e.currentTarget.style.borderColor = '#e5e5e5'}>
                    <div style={{ fontSize: '24px', marginBottom: '12px' }}>🚀</div>
                    <div style={{ fontSize: '17px', fontWeight: '600', marginBottom: '8px' }}>Venture Capital</div>
                    <div style={{ fontSize: '13px', color: '#666', marginBottom: '12px' }}>$100M fund · minority stakes</div>
                    <div style={{ fontSize: '12px', color: '#999', lineHeight: 1.4 }}>Early stage. High failure rates and <Jargon term="Power law">power-law</Jargon> returns. Expect to write off a third of the book and need a 10x to carry the fund.</div>
                  </button>
                  <button onClick={() => { setPendingFundType('PE'); setSetupStep('difficulty'); }} style={s.fundCard} onMouseOver={e => e.currentTarget.style.borderColor = '#0a0a0a'} onMouseOut={e => e.currentTarget.style.borderColor = '#e5e5e5'}>
                    <div style={{ fontSize: '24px', marginBottom: '12px' }}>🏛️</div>
                    <div style={{ fontSize: '17px', fontWeight: '600', marginBottom: '8px' }}>Private Equity</div>
                    <div style={{ fontSize: '13px', color: '#666', marginBottom: '12px' }}>$500M fund · control positions</div>
                    <div style={{ fontSize: '12px', color: '#999', lineHeight: 1.4 }}>Growth and buyout. Lower failure rates, longer holds, and access to <Jargon term="Leverage">leverage</Jargon>, <Jargon term="Add-on">add-ons</Jargon> and operational value creation.</div>
                  </button>
                </div>
                <button onClick={() => setGameState('intro')} style={{ ...s.btnSec, marginTop: '24px' }}>← Back</button>
              </div>
            </div>
          );
        }

        if (setupStep === 'difficulty') {
          const d = DIFFICULTY[pendingDifficulty];
          return (
            <div style={s.app}>
              <div style={s.setup}>
                <h1 style={{ fontSize: 'clamp(24px, 6vw, 34px)', fontWeight: '600', marginBottom: '10px' }}>Set the Difficulty</h1>
                <p style={{ fontSize: '14px', color: '#666', marginBottom: '28px', maxWidth: '440px' }}>Difficulty changes deal flow, failure rates, exit conditions, LP patience and how much the firm costs to run.</p>
                <div style={{ display: 'flex', gap: '8px', width: '100%', maxWidth: '520px', marginBottom: '14px', flexWrap: 'wrap' }}>
                  {DIFFICULTY_KEYS.map(key => {
                    const active = pendingDifficulty === key;
                    return (
                      <button key={key} onClick={() => setPendingDifficulty(key)} style={{
                        flex: '1 1 100px', padding: '14px 8px', borderRadius: '12px', cursor: 'pointer',
                        border: `1px solid ${active ? '#0a0a0a' : '#e5e5e5'}`,
                        background: active ? '#0a0a0a' : '#fff', color: active ? '#fff' : '#0a0a0a',
                      }}>
                        <div style={{ fontSize: '20px', marginBottom: '4px' }}>{DIFFICULTY[key].icon}</div>
                        <div style={{ fontSize: '12px', fontWeight: '600' }}>{DIFFICULTY[key].label}</div>
                      </button>
                    );
                  })}
                </div>
                <div style={{ fontSize: '12px', color: '#888', lineHeight: 1.55, textAlign: 'center', maxWidth: '460px', minHeight: '64px' }}>
                  <strong style={{ color: '#555' }}>{d.tag}.</strong> {d.desc}
                </div>
                <div style={{ display: 'flex', gap: '10px', fontSize: '10px', color: '#999', margin: '14px 0 24px', flexWrap: 'wrap', justifyContent: 'center' }}>
                  <span>Target {(Math.round((pendingFundType === 'VC' ? 2.4 : 2.0) * d.targetMult * 10) / 10)}x</span>
                  <span>· Failure ×{d.failMult}</span>
                  <span>· Exit ×{d.exitMult}</span>
                  <span>· Deal flow ×{d.dealFlowMult}</span>
                  <span>· Running costs ×{d.opexMult}</span>
                </div>
                <div style={{ display: 'flex', gap: '12px' }}>
                  <button onClick={() => setSetupStep('type')} style={s.btnSec}>← Back</button>
                  <button onClick={() => setSetupStep('mode')} style={s.btn}>Continue →</button>
                </div>
              </div>
            </div>
          );
        }

        if (setupStep === 'mode') {
          const modes = [
            { key: 'single', icon: '📘', name: 'Single Fund', desc: `One fund, ${FUND_LIFE_Q} quarters, generalist mandate. Invest across every vertical and see where you land against target.` },
            { key: 'thesis', icon: '🎯', name: 'Thesis Fund', desc: 'Pick three verticals and raise on that strategy. Only those companies reach you, and you get a specialist edge in them — plus all the concentration risk.' },
            { key: 'firm', icon: '🏛️', name: 'Build a Firm', desc: 'Endless. When a fund reaches the end of its life you raise a successor from the same LPs, sized by your track record. Capabilities and reputation carry over.' },
          ];
          return (
            <div style={s.app}>
              <div style={s.setup}>
                <h1 style={{ fontSize: 'clamp(24px, 6vw, 34px)', fontWeight: '600', marginBottom: '10px' }}>Choose a Mandate</h1>
                <p style={{ fontSize: '14px', color: '#666', marginBottom: '28px', maxWidth: '440px' }}>This is what you tell your LPs you are going to do. They will hold you to it.</p>
                <div style={{ display: 'grid', gap: '10px', width: '100%', maxWidth: '520px', marginBottom: '20px' }}>
                  {modes.map(m => (
                    <button key={m.key} onClick={() => setPendingMode(m.key)} style={{
                      padding: '16px', textAlign: 'left', borderRadius: '14px', cursor: 'pointer',
                      border: `1px solid ${pendingMode === m.key ? '#0a0a0a' : '#e5e5e5'}`,
                      background: pendingMode === m.key ? '#0a0a0a' : '#fff', color: pendingMode === m.key ? '#fff' : '#0a0a0a',
                    }}>
                      <div style={{ fontSize: '14px', fontWeight: '600', marginBottom: '4px' }}>{m.icon} {m.name}</div>
                      <div style={{ fontSize: '12px', lineHeight: 1.5, opacity: 0.75 }}>{m.desc}</div>
                    </button>
                  ))}
                </div>
                <div style={{ display: 'flex', gap: '12px' }}>
                  <button onClick={() => setSetupStep('difficulty')} style={s.btnSec}>← Back</button>
                  <button onClick={() => setSetupStep(pendingMode === 'thesis' ? 'thesis' : 'name')} style={s.btn}>Continue →</button>
                </div>
              </div>
            </div>
          );
        }

        if (setupStep === 'thesis') {
          const toggle = (k) => setPendingThesis(t => t.includes(k) ? t.filter(x => x !== k) : t.length < 3 ? [...t, k] : t);
          return (
            <div style={s.app}>
              <div style={{ ...s.setup, justifyContent: 'flex-start', paddingTop: '48px' }}>
                <h1 style={{ fontSize: 'clamp(22px, 6vw, 32px)', fontWeight: '600', marginBottom: '8px' }}>Define Your Thesis</h1>
                <p style={{ fontSize: '13px', color: '#666', marginBottom: '18px', maxWidth: '520px' }}>
                  Pick three verticals. Only those companies will come across your desk. Diligence is sharper in your sectors, founders take your call, and competitive processes go your way more often — but a shock to one of them hits the whole book.
                </p>
                <div className="vertical-grid" style={{ ...s.verticalGrid, maxWidth: '760px', marginBottom: '18px' }}>
                  {SECTOR_KEYS.map(k => {
                    const on = pendingThesis.includes(k);
                    const S = SECTORS[k];
                    const suited = (pendingFundType === 'VC' ? S.vc : S.pe) >= 0.7;
                    return (
                      <button key={k} onClick={() => toggle(k)} style={{
                        padding: '10px', borderRadius: '10px', textAlign: 'left', cursor: 'pointer',
                        border: `1px solid ${on ? '#0a0a0a' : '#e5e5e5'}`,
                        background: on ? '#0a0a0a' : '#fff', color: on ? '#fff' : '#0a0a0a',
                        opacity: on || pendingThesis.length < 3 ? 1 : 0.45,
                      }}>
                        <div style={{ fontSize: '12px', fontWeight: '600' }}>{S.icon} {k}</div>
                        <div style={{ fontSize: '9px', opacity: 0.7, marginTop: '3px' }}>
                          {suited ? 'Core for this fund type' : 'Less common for this fund type'}
                        </div>
                      </button>
                    );
                  })}
                </div>
                <div style={{ fontSize: '11px', color: '#999', marginBottom: '16px' }}>{pendingThesis.length} of 3 selected</div>
                <div style={{ display: 'flex', gap: '12px', paddingBottom: '40px' }}>
                  <button onClick={() => setSetupStep('mode')} style={s.btnSec}>← Back</button>
                  <button onClick={() => setSetupStep('name')} style={{ ...s.btn, ...(pendingThesis.length !== 3 ? s.btnDisabled : {}) }} disabled={pendingThesis.length !== 3}>Continue →</button>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div style={s.app}>
            <div style={s.setup}>
              <div style={{ fontSize: '32px', marginBottom: '16px' }}>{pendingFundType === 'VC' ? '🚀' : '🏛️'}</div>
              <h1 style={{ fontSize: 'clamp(24px, 6vw, 36px)', fontWeight: '600', marginBottom: '12px' }}>Name Your Firm</h1>
              <p style={{ fontSize: '13px', color: '#666', marginBottom: '10px', maxWidth: '400px' }}>
                {pendingFundType === 'VC' ? 'Venture Capital' : 'Private Equity'} · ${baseFundSize(pendingFundType)}M · {DIFFICULTY[pendingDifficulty].label} · {pendingMode === 'firm' ? 'Endless firm mode' : pendingMode === 'thesis' ? 'Thesis fund' : 'Single fund'}
              </p>
              {pendingMode === 'thesis' && (
                <p style={{ fontSize: '11px', color: '#999', marginBottom: '20px' }}>{pendingThesis.map(t => SECTORS[t].icon + ' ' + t).join(' · ')}</p>
              )}
              <input
                type="text" placeholder={pendingFundType === 'VC' ? 'e.g. Horizon Ventures' : 'e.g. Summit Capital'}
                value={inputFundName} onChange={e => setInputFundName(e.target.value)} maxLength={24}
                style={{ width: '100%', maxWidth: '300px', padding: '14px 18px', border: '1px solid #e5e5e5', borderRadius: '12px', fontSize: '15px', textAlign: 'center', marginBottom: '10px', outline: 'none' }}
                onFocus={e => e.target.style.borderColor = '#0a0a0a'} onBlur={e => e.target.style.borderColor = '#e5e5e5'} autoFocus
              />
              <p style={{ fontSize: '11px', color: '#aaa', marginBottom: '24px' }}>Your first fund will be called “{(inputFundName.trim() || (pendingFundType === 'VC' ? 'Horizon Ventures' : 'Summit Capital'))} I”.</p>
              <div style={{ display: 'flex', gap: '12px' }}>
                <button onClick={() => setSetupStep(pendingMode === 'thesis' ? 'thesis' : 'mode')} style={s.btnSec}>← Back</button>
                <button onClick={startGame} style={s.btn}>Launch Fund →</button>
              </div>
            </div>
          </div>
        );
      }

      // =====================================================================
      // RENDER — FUND CLOSE (endless mode)
      // =====================================================================

      if (gameState === 'fundclose' && fundClose) {
        const { score, sizeMult } = raiseAppetite();
        const nextSize = Math.max(25, Math.round(fundSize * sizeMult));
        const appetiteLabel = sizeMult === 0 ? 'No appetite' : sizeMult < 1 ? 'Reduced appetite' : sizeMult < 1.3 ? 'Steady support' : sizeMult < 1.8 ? 'Strong support' : 'Heavily oversubscribed';
        return (
          <div style={s.app}>
            <div style={{ ...s.gameOver, justifyContent: 'flex-start', paddingTop: '56px' }}>
              <div style={{ fontSize: '11px', fontWeight: '600', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: '8px', color: fundClose.won ? '#15803d' : '#b91c1c' }}>
                {fundClose.fundName} · Final Close
              </div>
              <div style={{ fontSize: 'clamp(40px, 12vw, 64px)', fontWeight: '700', letterSpacing: '-0.04em' }}>{fundClose.moic.toFixed(2)}x</div>
              <div style={{ fontSize: '14px', color: '#666', marginBottom: '20px' }}>
                {fundClose.won ? `Beat the ${fundClose.target}x target` : `Target was ${fundClose.target}x`} · DPI {fundClose.dpi.toFixed(2)}x
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '10px', maxWidth: '340px', width: '100%', marginBottom: '20px' }}>
                <div style={{ padding: '12px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: '10px' }}><div style={{ fontSize: '9px', color: '#999' }}>Returned</div><div style={{ fontSize: '15px', fontWeight: '600' }}>${fundClose.returned.toFixed(0)}M</div></div>
                <div style={{ padding: '12px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: '10px' }}><div style={{ fontSize: '9px', color: '#999' }}><Jargon term="Carried interest">Carry earned</Jargon></div><div style={{ fontSize: '15px', fontWeight: '600', color: fundClose.carry > 0 ? '#15803d' : '#999' }}>${fundClose.carry.toFixed(1)}M</div></div>
                <div style={{ padding: '12px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: '10px' }}><div style={{ fontSize: '9px', color: '#999' }}>Exits / write-offs</div><div style={{ fontSize: '15px', fontWeight: '600' }}>{fundClose.exits} / {fundClose.failures}</div></div>
                <div style={{ padding: '12px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: '10px' }}><div style={{ fontSize: '9px', color: '#999' }}>Still held</div><div style={{ fontSize: '15px', fontWeight: '600' }}>{fundClose.held}</div></div>
              </div>
              {fundClose.carry === 0 && fundClose.moic > 1 && (
                <div style={{ fontSize: '11px', color: '#92400e', background: '#fffbeb', border: '1px solid #fcd34d', borderRadius: '10px', padding: '10px 12px', maxWidth: '420px', marginBottom: '20px', lineHeight: 1.5 }}>
                  You made money but earned no <Jargon term="Carried interest">carry</Jargon>: LPs must first clear the <Jargon term="Hurdle rate">8% preferred return</Jargon>, which over a ten-year fund means about {HURDLE_MULTIPLE.toFixed(2)}x before the GP shares in profits.
                </div>
              )}

              <div style={{ width: '100%', maxWidth: '460px', padding: '18px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: '16px', textAlign: 'left' }}>
                <div style={{ fontSize: '11px', fontWeight: '600', letterSpacing: '0.06em', textTransform: 'uppercase', color: '#999', marginBottom: '10px' }}>Raising {firmName} {ROMAN[Math.min(fundNumber, ROMAN.length - 1)]}</div>
                <div style={{ height: '6px', background: '#f0f0f0', borderRadius: '3px', overflow: 'hidden', marginBottom: '8px' }}>
                  <div style={{ height: '100%', width: `${clamp(score / 130, 0, 1) * 100}%`, background: sizeMult === 0 ? '#b91c1c' : sizeMult < 1.3 ? '#f59e0b' : '#22c55e' }} />
                </div>
                <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '6px' }}>{appetiteLabel}</div>
                <div style={{ fontSize: '12px', color: '#666', lineHeight: 1.55, marginBottom: '14px' }}>
                  {sizeMult === 0
                    ? 'Your LPs have declined to re-up. Without realisations and a credible story, there is no successor fund — which is how most emerging managers actually end.'
                    : <>LP appetite is driven mostly by <Jargon term="Dpi">DPI</Jargon> — cash actually returned — then by marks, LP confidence and your reputation. They will commit <strong>${nextSize}M</strong> to the next vehicle.</>}
                </div>
                {sizeMult > 0 && portfolio.length > 0 && (
                  <div style={{ padding: '10px 12px', background: '#f8f8f6', borderRadius: '10px', marginBottom: '12px', fontSize: '11px', color: '#666', lineHeight: 1.5 }}>
                    You still hold {portfolio.length} position{portfolio.length > 1 ? 's' : ''} worth ${nav.toFixed(1)}M. A <Jargon term="Continuation vehicle">continuation vehicle</Jargon> lets the new fund buy them from the old one at 88% of carrying value, so you keep backing them.
                  </div>
                )}
                <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                  {sizeMult > 0 && portfolio.length > 0 && <Btn onClick={() => raiseNextFund(true)}>Raise ${nextSize}M + roll positions</Btn>}
                  {sizeMult > 0 && <Btn variant={portfolio.length > 0 ? 'secondary' : 'primary'} onClick={() => raiseNextFund(false)}>Raise ${nextSize}M {portfolio.length > 0 ? 'clean' : ''}</Btn>}
                  <Btn variant="secondary" onClick={endFirm}>Wind down the firm</Btn>
                </div>
              </div>

              {firmHistory.length > 0 && (
                <div style={{ marginTop: '20px', width: '100%', maxWidth: '460px' }}>
                  <div style={{ ...s.sectionTitle, textAlign: 'left' }}>Track record</div>
                  {firmHistory.map((h, i) => (
                    <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', padding: '6px 0', borderBottom: '1px solid #f0f0f0' }}>
                      <span style={{ color: '#666' }}>{h.fundName} · ${h.fundSize}M</span>
                      <span style={{ fontWeight: '600', color: h.moic >= 2 ? '#15803d' : h.moic >= 1 ? '#0a0a0a' : '#b91c1c' }}>{h.moic.toFixed(2)}x · DPI {h.dpi.toFixed(2)}x</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      // =====================================================================
      // RENDER — GAME OVER
      // =====================================================================

      if (gameState === 'over' && gameOver) {
        return (
          <div style={s.app}>
            <div style={{ ...s.gameOver, justifyContent: 'flex-start', paddingTop: '56px' }}>
              <div style={{ fontSize: '11px', fontWeight: '600', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: '8px', color: gameOver.won ? '#15803d' : '#b91c1c' }}>
                {gameOver.firmOver ? '🏛️ Firm Wound Down' : gameOver.earlyRetirement ? '🏁 Fund Closed Early' : gameOver.won ? '🎉 Fund Success' : '📉 Below Target'}
              </div>
              <div style={{ fontSize: 'clamp(48px, 14vw, 72px)', fontWeight: '700', letterSpacing: '-0.04em', marginBottom: '8px' }}>{gameOver.moic.toFixed(2)}x</div>
              <div style={{ fontSize: '15px', color: '#666', marginBottom: '6px' }}>
                {gameOver.won ? `Beat the ${gameOver.target}x target` : `Target was ${gameOver.target}x`}
              </div>
              <div style={{ fontSize: '11px', color: '#999', marginBottom: '6px' }}>
                {diff.icon} {diff.label} · {fundType} · {thesis && thesis.length ? thesis.map(t => SECTORS[t].icon).join(' ') + ' thesis' : 'generalist'}
              </div>
              {gameOver.reason && <div style={{ fontSize: '12px', color: '#b91c1c', marginBottom: '8px' }}>{gameOver.reason}</div>}
              {gameOver.earlyRetirement && <div style={{ fontSize: '12px', color: '#999', marginBottom: '12px' }}>Wound up at Q{gameOver.quarter}/{FUND_LIFE_Q} · portfolio liquidated at a 30% discount</div>}

              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '10px', maxWidth: '380px', width: '100%', marginTop: '18px', marginBottom: '18px' }}>
                {[
                  ['Returned', `$${gameOver.returned.toFixed(0)}M`],
                  ['DPI', `${gameOver.dpi.toFixed(2)}x`],
                  ['Carry', `$${gameOver.carry.toFixed(1)}M`],
                  ['Exits', gameOver.exits],
                  ['Write-offs', gameOver.failures],
                  ['Fees & costs', `$${gameOver.feesPaid.toFixed(0)}M`],
                  ['Fees kept', `$${(gameOver.gpEarnings || 0).toFixed(1)}M`],
                ].map(([k, v]) => (
                  <div key={k} style={{ padding: '10px', background: '#fff', border: '1px solid #e5e5e5', borderRadius: '10px' }}>
                    <div style={{ fontSize: '9px', color: '#999' }}>{k}</div>
                    <div style={{ fontSize: '14px', fontWeight: '600' }}>{v}</div>
                  </div>
                ))}
              </div>

              {(gameOver.bestInv || gameOver.worstInv) && (
                <div style={{ display: 'flex', gap: '12px', marginBottom: '20px', maxWidth: '360px', width: '100%' }}>
                  {gameOver.bestInv && (
                    <div style={{ flex: 1, padding: '12px', background: '#f0fdf4', border: '1px solid #bbf7d0', borderRadius: '10px', textAlign: 'left' }}>
                      <div style={{ fontSize: '9px', color: '#15803d', fontWeight: '600', letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: '4px' }}>Best</div>
                      <div style={{ fontSize: '13px', fontWeight: '600' }}>{gameOver.bestInv.name}</div>
                      <div style={{ fontSize: '12px', color: '#15803d', fontWeight: '500' }}>{gameOver.bestInv.moic.toFixed(2)}x</div>
                    </div>
                  )}
                  {gameOver.worstInv && (
                    <div style={{ flex: 1, padding: '12px', background: '#fef2f2', border: '1px solid #fecaca', borderRadius: '10px', textAlign: 'left' }}>
                      <div style={{ fontSize: '9px', color: '#b91c1c', fontWeight: '600', letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: '4px' }}>Worst</div>
                      <div style={{ fontSize: '13px', fontWeight: '600' }}>{gameOver.worstInv.name}</div>
                      <div style={{ fontSize: '12px', color: '#b91c1c', fontWeight: '500' }}>{gameOver.worstInv.moic.toFixed(2)}x{gameOver.worstInv.type === 'failed' && ' (written off)'}</div>
                    </div>
                  )}
                </div>
              )}

              {gameOver.firmOver && gameOver.firmHistory && gameOver.firmHistory.length > 0 && (
                <div style={{ width: '100%', maxWidth: '440px', marginBottom: '20px' }}>
                  <div style={{ ...s.sectionTitle, textAlign: 'left' }}>{gameOver.firmHistory.length} funds · ${gameOver.lifetimeCarry.toFixed(1)}M lifetime carry</div>
                  {gameOver.firmHistory.map((h, i) => (
                    <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', padding: '6px 0', borderBottom: '1px solid #f0f0f0' }}>
                      <span style={{ color: '#666' }}>{h.fundName} · ${h.fundSize}M</span>
                      <span style={{ fontWeight: '600', color: h.moic >= 2 ? '#15803d' : h.moic >= 1 ? '#0a0a0a' : '#b91c1c' }}>{h.moic.toFixed(2)}x</span>
                    </div>
                  ))}
                </div>
              )}

              <Btn onClick={resetGame}>Play Again</Btn>
            </div>
          </div>
        );
      }

      // =====================================================================
      // RENDER — MAIN GAME
      // =====================================================================

      const mandateType = mandate ? MANDATE_TYPES.find(t => t.id === mandate.id) : null;
      const negDeal = negotiation && negotiation.deal;
      const maxLeverage = lvl('capMarkets').lev;

      return (
        <div style={s.app}>
          <div style={s.container}>
            {showSpotlight && <SpotlightTutorial step={spotlightStep} onNext={() => spotlightStep < SPOTLIGHT_STEPS.length - 1 ? setSpotlightStep(v => v + 1) : setShowSpotlight(false)} onSkip={() => setShowSpotlight(false)} />}
            {showAcademy && <AcademyModal onClose={() => setShowAcademy(false)} />}
            {showSectors && <SectorGuideModal onClose={() => setShowSectors(false)} fundType={fundType} thesis={thesis} />}

            {/* ---------- portfolio decision ---------- */}
            {current && current.kind === 'decision' && (
              <div style={s.modal}>
                <div style={s.modalContent}>
                  <div style={s.modalHeader}><span style={{ fontSize: '15px', fontWeight: '600' }}>{current.payload.event.title}</span></div>
                  <div style={s.modalBody}>
                    <p style={{ fontSize: '13px', color: '#444', marginBottom: '16px', lineHeight: 1.5 }}>{current.payload.event.description.replace('{company}', current.payload.company.name)}</p>
                    {current.payload.event.choices.map((c, i) => (
                      <div key={i} role="button" tabIndex={0} style={s.decisionCard} onClick={() => handlePortfolioDecision(i)} onMouseOver={e => e.currentTarget.style.borderColor = '#0a0a0a'} onMouseOut={e => e.currentTarget.style.borderColor = 'transparent'}>
                        <div style={{ fontSize: '12px', fontWeight: '500' }}>{c.text}</div>
                        {c.effect.cost && <div style={{ fontSize: '10px', color: '#666', marginTop: '3px' }}>Cost: ${c.effect.cost}M</div>}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ---------- follow-on ---------- */}
            {current && current.kind === 'followon' && (
              <div style={s.modal}>
                <div style={s.modalContent}>
                  <div style={s.modalHeader}><span style={{ fontSize: '15px', fontWeight: '600' }}>{current.payload.scenario.title}</span></div>
                  <div style={s.modalBody}>
                    <p style={{ fontSize: '13px', color: '#444', marginBottom: '14px', lineHeight: 1.5 }}>
                      {current.payload.scenario.description
                        .replace('{company}', current.payload.company.name)
                        .replace('{valuation}', `$${current.payload.newValuation.toFixed(0)}M`)
                        .replace('{amount}', current.payload.proRataAmount.toFixed(1))}
                    </p>
                    <div style={{ padding: '10px', background: '#f8f8f6', borderRadius: '8px', marginBottom: '14px', fontSize: '11px', color: '#666' }}>
                      <Jargon term="Pro-rata">Pro-rata</Jargon>: <strong>${current.payload.proRataAmount.toFixed(1)}M</strong> · <Jargon term="Dry powder">Dry powder</Jargon>: <strong>${dryPowder.toFixed(1)}M</strong>
                    </div>
                    {current.payload.scenario.isDown && <div style={{ padding: '8px 10px', background: '#fef2f2', borderRadius: '8px', color: '#b91c1c', fontSize: '11px', lineHeight: 1.4 }}>⚠️ A <Jargon term="Down round">down round</Jargon>. Passing means heavy <Jargon term="Dilution">dilution</Jargon> — this is exactly what <Jargon term="Pro-rata">pro-rata rights</Jargon> exist to defend against.</div>}
                  </div>
                  <div style={s.modalFooter}>
                    <Btn variant="secondary" onClick={() => handleFollowOn(false)}>{current.payload.scenario.isDown ? 'Accept dilution' : 'Pass'}</Btn>
                    <Btn onClick={() => handleFollowOn(true)} disabled={dryPowder < current.payload.proRataAmount}>Invest</Btn>
                  </div>
                </div>
              </div>
            )}

            {/* ---------- add-on ---------- */}
            {current && current.kind === 'addon' && (
              <div style={s.modal}>
                <div style={s.modalContent}>
                  <div style={s.modalHeader}><span style={{ fontSize: '15px', fontWeight: '600' }}>Add-On Acquisition</span></div>
                  <div style={s.modalBody}>
                    <p style={{ fontSize: '13px', color: '#444', marginBottom: '14px', lineHeight: 1.5 }}>
                      A smaller competitor has come up for sale that would fold neatly into <strong>{current.payload.company.name}</strong>. Bolting it on costs <strong>${current.payload.cost.toFixed(1)}M</strong> and should lift value by roughly {Math.round(current.payload.uplift * 100)}% — if the integration goes well.
                    </p>
                    <div style={{ padding: '10px', background: '#f8f8f6', borderRadius: '8px', fontSize: '11px', color: '#666', lineHeight: 1.5 }}>
                      <Jargon term="Buy-and-build">Buy-and-build</Jargon> is now behind most buyout activity: small companies trade at lower multiples than the enlarged group does when you sell it. Integration risk here is {Math.round(current.payload.integrationRisk * 100)}% — stronger operating partners bring that down.
                    </div>
                  </div>
                  <div style={s.modalFooter}>
                    <Btn variant="secondary" onClick={() => handleAddOn(false)}>Pass</Btn>
                    <Btn onClick={() => handleAddOn(true)} disabled={dryPowder < current.payload.cost}>Acquire</Btn>
                  </div>
                </div>
              </div>
            )}

            {/* ---------- firm event ---------- */}
            {current && current.kind === 'firm' && (
              <div style={s.modal}>
                <div style={s.modalContent}>
                  <div style={s.modalHeader}>
                    <div>
                      <div style={{ fontSize: '9px', fontWeight: '600', letterSpacing: '0.1em', textTransform: 'uppercase', color: '#999' }}>The Firm</div>
                      <span style={{ fontSize: '15px', fontWeight: '600' }}>{current.payload.title}</span>
                    </div>
                  </div>
                  <div style={s.modalBody}>
                    <p style={{ fontSize: '13px', color: '#444', marginBottom: '16px', lineHeight: 1.55 }}>{current.payload.text}</p>
                    {current.payload.choices.map((c, i) => (
                      <div key={i} role="button" tabIndex={0} style={s.decisionCard} onClick={() => handleFirmEvent(i)} onMouseOver={e => e.currentTarget.style.borderColor = '#0a0a0a'} onMouseOut={e => e.currentTarget.style.borderColor = 'transparent'}>
                        <div style={{ fontSize: '12px', fontWeight: '500' }}>{c.text}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ---------- LP meeting ---------- */}
            {current && current.kind === 'lp' && (
              <div style={s.modal}>
                <div style={s.modalContent}>
                  <div style={s.modalHeader}>
                    <div>
                      <div style={{ fontSize: '9px', fontWeight: '600', letterSpacing: '0.1em', textTransform: 'uppercase', color: '#999' }}>Limited Partners</div>
                      <span style={{ fontSize: '15px', fontWeight: '600' }}>{current.payload.title}</span>
                    </div>
                  </div>
                  <div style={s.modalBody}>
                    <p style={{ fontSize: '13px', color: '#444', marginBottom: '16px', lineHeight: 1.55 }}>{current.payload.body}</p>
                    {current.payload.choices.map((c, i) => (
                      <div key={i} role="button" tabIndex={0} style={s.decisionCard} onClick={() => handleLPMeeting(i)} onMouseOver={e => e.currentTarget.style.borderColor = '#0a0a0a'} onMouseOut={e => e.currentTarget.style.borderColor = 'transparent'}>
                        <div style={{ fontSize: '12px', fontWeight: '500' }}>{c.text}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ---------- investment committee ---------- */}
            {icReview && (
              <div style={s.modal}>
                <div style={s.modalContent}>
                  <div style={s.modalHeader}>
                    <div>
                      <div style={{ fontSize: '9px', fontWeight: '600', letterSpacing: '0.1em', textTransform: 'uppercase', color: '#999' }}>Investment Committee</div>
                      <span style={{ fontSize: '15px', fontWeight: '600' }}>{icReview.deal.name}</span>
                    </div>
                  </div>
                  <div style={s.modalBody}>
                    <div style={{ fontSize: '12px', color: '#666', marginBottom: '14px', lineHeight: 1.5 }}>
                      ${icReview.terms.amount.toFixed(1)}M at {icReview.terms.multiple.toFixed(1)}x — {(icReview.terms.amount / fundSize * 100).toFixed(0)}% of the fund. A cheque this size needs <Jargon term="Investment committee">IC</Jargon> approval: two of three partners must vote yes.
                    </div>
                    {icReview.result.votes.map((v, i) => (
                      <div key={i} style={{ padding: '10px 12px', borderRadius: '10px', marginBottom: '8px', background: v.vote ? '#f0fdf4' : '#fef2f2', border: `1px solid ${v.vote ? '#bbf7d0' : '#fecaca'}` }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>
                          <span style={{ fontSize: '12px', fontWeight: '600' }}>{v.partner}</span>
                          <span style={{ fontSize: '10px', fontWeight: '600', color: v.vote ? '#15803d' : '#b91c1c' }}>{v.vote ? 'IN FAVOUR' : 'AGAINST'}</span>
                        </div>
                        <div style={{ fontSize: '11px', color: '#555', lineHeight: 1.5, fontStyle: 'italic' }}>“{v.reason}”</div>
                      </div>
                    ))}
                  </div>
                  <div style={s.modalFooter}>
                    {icReview.result.approved
                      ? <><Btn variant="secondary" onClick={() => setIcReview(null)}>Hold off</Btn><Btn onClick={() => resolveIC(true)}>Approve & wire</Btn></>
                      : <Btn onClick={() => resolveIC(false)}>Take it away and rework it</Btn>}
                  </div>
                </div>
              </div>
            )}

            {/* ---------- exit routes ---------- */}
            {exitTarget && (() => {
              const inv = exitTarget;
              const hold = quarter - inv.quarterInvested;
              const minHold = minHoldFor(fundType, inv.sector);
              return (
                <div style={s.modal}>
                  <div style={{ ...s.modalContent, maxWidth: '480px' }}>
                    <div style={s.modalHeader}>
                      <div>
                        <div style={{ fontSize: '9px', fontWeight: '600', letterSpacing: '0.1em', textTransform: 'uppercase', color: '#999' }}>Exit process</div>
                        <span style={{ fontSize: '15px', fontWeight: '600' }}>{inv.name}</span>
                      </div>
                      <button onClick={() => setExitTarget(null)} style={{ background: 'none', border: 'none', fontSize: '18px', color: '#999', cursor: 'pointer' }}>×</button>
                    </div>
                    <div style={s.modalBody}>
                      <div style={{ fontSize: '11px', color: '#666', marginBottom: '12px' }}>
                        Held {hold}Q · carried at ${inv.currentValue.toFixed(1)}M ({(inv.currentValue / inv.investedAmount).toFixed(2)}x){inv.debt > 0.05 ? ` · $${inv.debt.toFixed(1)}M debt outstanding` : ''}
                      </div>
                      {EXIT_ROUTES.map(r => {
                        const locked = (r.key !== 'secondary' && hold < minHold) || !routeAvailable(r, inv);
                        const odds = exitOdds(r, inv);
                        return (
                          <div key={r.key} role="button" tabIndex={0} onClick={() => !locked && executeExit(inv, r)} style={{
                            ...s.decisionCard, cursor: locked ? 'not-allowed' : 'pointer', opacity: locked ? 0.45 : 1,
                          }} onMouseOver={e => { if (!locked) e.currentTarget.style.borderColor = '#0a0a0a'; }} onMouseOut={e => e.currentTarget.style.borderColor = 'transparent'}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                              <span style={{ fontSize: '12px', fontWeight: '600' }}>{r.icon} {r.name}</span>
                              <span style={{ fontSize: '10px', color: locked ? '#999' : odds > 0.6 ? '#15803d' : odds > 0.35 ? '#92400e' : '#b91c1c' }}>
                                {locked ? (hold < minHold ? `${minHold - hold}Q to go` : 'not available') : r.key === 'secondary' ? 'always clears' : `~${Math.round(odds * 100)}% clears`}
                              </span>
                            </div>
                            <div style={{ fontSize: '11px', color: '#666', lineHeight: 1.45 }}>{r.note}</div>
                            {!locked && <div style={{ fontSize: '10px', color: '#999', marginTop: '4px' }}>Indicative proceeds ≈ ${Math.max(0, (inv.assetValue != null ? inv.assetValue : inv.currentValue) * 1.05 * r.priceMod * market.exitModifier * diff.exitMult * (1 + inv.trueQuality * 0.3) - (inv.debt || 0)).toFixed(1)}M</div>}
                          </div>
                        );
                      })}
                      <div style={{ fontSize: '10px', color: '#999', lineHeight: 1.5, marginTop: '4px' }}>
                        A failed process is not free: bankers, lawyers and management time are spent, and the market notices an asset that was shopped and not sold.
                      </div>
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* ---------- negotiation ---------- */}
            {negotiation && (
              <div style={s.modal}>
                <div style={{ ...s.modalContent, maxWidth: '470px' }} id="negotiate-example">
                  <div style={s.modalHeader}>
                    <span style={{ fontSize: '15px', fontWeight: '600' }}>{negDeal.name}</span>
                    <button onClick={walkFromNegotiation} style={{ background: 'none', border: 'none', fontSize: '18px', color: '#999', cursor: 'pointer' }}>×</button>
                  </div>
                  <div style={s.modalBody}>
                    <div style={{ fontSize: '10px', color: '#999', marginBottom: '8px' }}>{negDeal.founderType} · {negDeal.founderBg} · Round {negotiation.round}/{negotiation.maxRounds}</div>
                    <div style={{ height: '4px', background: '#f0f0f0', borderRadius: '2px', marginBottom: '14px', overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${negotiation.mood}%`, background: negotiation.mood > 70 ? '#22c55e' : negotiation.mood > 40 ? '#f59e0b' : '#ef4444', transition: 'width 0.3s ease' }} />
                    </div>
                    <div style={{ padding: '10px', background: '#f8f8f6', borderRadius: '8px', fontSize: '11px', color: '#666', fontStyle: 'italic', marginBottom: '14px' }}>“{negotiation.msg}”</div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '12px' }}>
                      <div>
                        <label style={{ fontSize: '10px', fontWeight: '500', color: '#666' }}>{isVC ? 'Round size' : 'Enterprise value'} ($M)</label>
                        <input type="number" step="0.5" value={negotiation.terms.amount} onChange={e => setNegotiation(p => ({ ...p, terms: { ...p.terms, amount: parseFloat(e.target.value) || 0 } }))} style={{ width: '100%', padding: '8px', border: '1px solid #e5e5e5', borderRadius: '8px', fontSize: '12px', marginTop: '4px' }} />
                      </div>
                      <div>
                        <label style={{ fontSize: '10px', fontWeight: '500', color: '#666' }}><Jargon term="Multiple">Multiple</Jargon> ({isVC ? 'revenue' : <Jargon term="Ebitda">EBITDA</Jargon>})</label>
                        <input type="number" step="0.5" value={negotiation.terms.multiple} onChange={e => setNegotiation(p => ({ ...p, terms: { ...p.terms, multiple: parseFloat(e.target.value) || 0 } }))} style={{ width: '100%', padding: '8px', border: '1px solid #e5e5e5', borderRadius: '8px', fontSize: '12px', marginTop: '4px' }} />
                      </div>
                    </div>
                    <div style={{ display: 'flex', gap: '8px', marginBottom: '12px' }}>
                      <label style={{ display: 'flex', alignItems: 'center', gap: '6px', padding: '8px', background: '#FAFAF8', borderRadius: '8px', fontSize: '11px', cursor: 'pointer' }}>
                        <input type="checkbox" checked={negotiation.terms.boardSeat} onChange={e => setNegotiation(p => ({ ...p, terms: { ...p.terms, boardSeat: e.target.checked } }))} />
                        <Jargon term="Board seat">Board seat</Jargon>
                      </label>
                      <label style={{ display: 'flex', alignItems: 'center', gap: '6px', padding: '8px', background: '#FAFAF8', borderRadius: '8px', fontSize: '11px', cursor: 'pointer' }}>
                        <input type="checkbox" checked={negotiation.terms.proRata} onChange={e => setNegotiation(p => ({ ...p, terms: { ...p.terms, proRata: e.target.checked } }))} />
                        <Jargon term="Pro-rata">Pro-rata</Jargon>
                      </label>
                    </div>
                    {negDeal.leverageAvailable && maxLeverage > 0 && (
                      <div style={{ padding: '10px', background: '#FAFAF8', borderRadius: '10px', marginBottom: '12px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '10px', color: '#666', marginBottom: '6px' }}>
                          <span><Jargon term="Leverage">Debt financing</Jargon></span>
                          <span style={{ fontWeight: '600' }}>{Math.round(negotiation.terms.leverage * 100)}% · equity cheque ${equityCheque(negotiation.terms).toFixed(1)}M</span>
                        </div>
                        <input type="range" min="0" max={Math.round(maxLeverage * 100)} step="5" value={Math.round(negotiation.terms.leverage * 100)}
                          onChange={e => setNegotiation(p => ({ ...p, terms: { ...p.terms, leverage: parseInt(e.target.value, 10) / 100 } }))}
                          style={{ width: '100%' }} />
                        <div style={{ fontSize: '10px', color: '#999', lineHeight: 1.45, marginTop: '4px' }}>
                          Debt shrinks the equity you commit and magnifies the return on it — and the loss if trading disappoints. Breach a <Jargon term="Covenant">covenant</Jargon> and the lender takes control.
                        </div>
                      </div>
                    )}
                    {negotiation.counter && (
                      <div style={{ padding: '10px', background: '#fffbeb', border: '1px solid #fcd34d', borderRadius: '8px', marginBottom: '12px' }}>
                        <div style={{ fontSize: '9px', fontWeight: '600', color: '#92400e', marginBottom: '3px' }}>COUNTER OFFER</div>
                        <div style={{ fontSize: '13px', fontWeight: '600' }}>${negotiation.counter.amount.toFixed(1)}M at {negotiation.counter.multiple.toFixed(1)}x</div>
                      </div>
                    )}
                    <div style={{ fontSize: '10px', color: '#999', padding: '8px', background: '#f8f8f6', borderRadius: '6px', lineHeight: 1.45 }}>
                      💡 Push too hard and the founder walks for good. Cheques above {Math.round(diff.icThreshold * 100)}% of the fund go to the <Jargon term="Investment committee">investment committee</Jargon>.
                    </div>
                  </div>
                  <div style={s.modalFooter}>
                    <Btn variant="secondary" onClick={walkFromNegotiation}>Walk away</Btn>
                    {negotiation.counter && <Btn onClick={acceptCounter}>Accept counter</Btn>}
                    <Btn onClick={submitOffer}>Submit offer</Btn>
                  </div>
                </div>
              </div>
            )}

            {/* ---------- firm panel ---------- */}
            {showFirm && (
              <div style={s.modal} onClick={() => setShowFirm(false)}>
                <div style={{ ...s.modalContent, maxWidth: '660px', maxHeight: '88vh', display: 'flex', flexDirection: 'column' }} onClick={e => e.stopPropagation()}>
                  <div style={s.modalHeader}>
                    <div>
                      <div style={{ fontSize: '9px', fontWeight: '600', letterSpacing: '0.12em', textTransform: 'uppercase', color: '#999' }}>Build the firm</div>
                      <span style={{ fontSize: '16px', fontWeight: '600' }}>{firmName}</span>
                    </div>
                    <button onClick={() => setShowFirm(false)} style={{ background: 'none', border: 'none', fontSize: '20px', color: '#999', cursor: 'pointer' }}>×</button>
                  </div>
                  <div style={{ padding: '12px 16px', borderBottom: '1px solid #f0f0f0', display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px' }}>
                    {[
                      ['Fee charged', `$${feeIncome.toFixed(2)}M/q`, '#666'],
                      ['Firm running costs', `$${quarterlyOpex.toFixed(2)}M/q`, quarterlyOpex > feeIncome ? '#b91c1c' : '#666'],
                      ['Fund expenses', `$${fundExpenses.toFixed(2)}M/q`, '#666'],
                      ['Drawn from the fund', `−$${quarterlyDrag.toFixed(2)}M/q`, '#b91c1c'],
                    ].map(([k, v, c]) => (
                      <div key={k}>
                        <div style={{ fontSize: '8px', textTransform: 'uppercase', letterSpacing: '0.06em', color: '#999', fontWeight: '600' }}>{k}</div>
                        <div style={{ fontSize: '12px', fontWeight: '600', color: c }}>{v}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{ ...s.modalBody, overflowY: 'auto' }}>
                    <div style={{ fontSize: '11px', color: '#666', lineHeight: 1.5, marginBottom: '12px', padding: '10px', background: '#f8f8f6', borderRadius: '10px' }}>
                      The <Jargon term="Management fee">management fee</Jargon> is charged to the fund every quarter whether you need it or not, and it is what pays for the firm. Build beyond what the fee supports and the shortfall is drawn from the fund as well — capital that will never be invested. Nobody can afford all nine tracks, so choose the shape of firm you want to be. Fee left over after costs is yours to keep{gpEarnings > 0 ? `, and you have banked $${gpEarnings.toFixed(1)}M of it so far` : ''}.
                    </div>
                    {UPGRADE_KEYS.map(k => {
                      const u = UPGRADES[k];
                      const curr = upgrades[k];
                      const c = u.levels[curr];
                      const n = u.levels[curr + 1];
                      const cost = n ? upgradeCost(k, curr + 1) : 0;
                      const can = n && cash >= cost;
                      return (
                        <div key={k} style={{ padding: '12px', background: '#fff', border: '1px solid #eee', borderRadius: '12px', marginBottom: '8px' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '10px' }}>
                            <div style={{ flex: 1 }}>
                              <div style={{ fontSize: '13px', fontWeight: '600' }}>{u.icon} {u.name}</div>
                              <div style={{ fontSize: '11px', color: '#666', margin: '4px 0 6px', lineHeight: 1.45 }}>{u.detail}</div>
                              <div style={{ display: 'flex', gap: '3px', marginBottom: '4px' }}>
                                {u.levels.map((L, i) => (
                                  <div key={i} style={{ flex: 1, height: '4px', borderRadius: '2px', background: i <= curr ? '#0a0a0a' : '#eee' }} />
                                ))}
                              </div>
                              <div style={{ fontSize: '10px', color: '#999' }}>
                                Now: <strong style={{ color: '#666' }}>{c.name}</strong> · running cost ${(c.o * costScale * diff.opexMult).toFixed(2)}M/q{k === 'irDesk' ? ` · recycling allowance $${recycleCapacity.toFixed(0)}M` : ''}
                              </div>
                            </div>
                            <div style={{ textAlign: 'right', minWidth: '96px' }}>
                              {n ? (
                                <>
                                  <button onClick={() => purchaseUpgrade(k)} disabled={!can} style={{
                                    padding: '6px 10px', fontSize: '10px', borderRadius: '100px',
                                    background: can ? '#0a0a0a' : '#f5f5f3', color: can ? '#fff' : '#999',
                                    border: 'none', cursor: can ? 'pointer' : 'not-allowed',
                                  }}>${cost.toFixed(1)}M</button>
                                  <div style={{ fontSize: '9px', color: '#999', marginTop: '4px', lineHeight: 1.3 }}>→ {n.name}<br />+${((n.o - c.o) * costScale * diff.opexMult).toFixed(2)}M/q</div>
                                </>
                              ) : <span style={{ fontSize: '10px', color: '#15803d', fontWeight: '600' }}>Fully built</span>}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ---------- full log ---------- */}
            {showFullLog && (
              <div style={s.modal} onClick={() => setShowFullLog(false)}>
                <div style={{ ...s.modalContent, maxWidth: '520px', maxHeight: '84vh', display: 'flex', flexDirection: 'column' }} onClick={e => e.stopPropagation()}>
                  <div style={s.modalHeader}>
                    <span style={{ fontSize: '15px', fontWeight: '600' }}>Fund activity — {fundName}</span>
                    <button onClick={() => setShowFullLog(false)} style={{ background: 'none', border: 'none', fontSize: '20px', color: '#999', cursor: 'pointer' }}>×</button>
                  </div>
                  <div style={{ ...s.modalBody, overflowY: 'auto' }}>
                    {groupedLog.length === 0 ? <div style={s.empty}>Nothing has happened yet.</div> : groupedLog.map(g => (
                      <div key={g.q} style={{ marginBottom: '12px' }}>
                        <div style={{ fontSize: '10px', fontWeight: '600', color: '#999', letterSpacing: '0.06em', marginBottom: '4px' }}>QUARTER {g.q}{g.q === quarter ? ' · current' : ''}</div>
                        {g.items.map(e => (

                    <span style={{ fontSize: '10px', color: quarterlyOpex > feeIncome ? '#b91c1c' : '#999', marginBottom: '10px' }}>−${quarterlyDrag.toFixed(2)}M/q</span>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '5px', marginBottom: '10px' }}>
                    {UPGRADE_KEYS.map(k => (
                      <div key={k} style={{ padding: '6px 4px', background: '#FAFAF8', borderRadius: '8px', textAlign: 'center' }} title={`${UPGRADES[k].name}: ${UPGRADES[k].levels[upgrades[k]].name}`}>
                        <div style={{ fontSize: '13px' }}>{UPGRADES[k].icon}</div>
                        <div style={{ fontSize: '8px', color: '#999', marginTop: '2px' }}>{UPGRADES[k].short}</div>
                        <div style={{ display: 'flex', gap: '1px', justifyContent: 'center', marginTop: '3px' }}>
                          {UPGRADES[k].levels.map((_, i) => (
                            <div key={i} style={{ width: '3px', height: '3px', borderRadius: '50%', background: i <= upgrades[k] ? '#0a0a0a' : '#ddd' }} />
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                  <button onClick={() => setShowFirm(true)} style={{ ...s.btnSec, width: '100%', padding: '8px' }}>Build the firm →</button>
                </div>

                <div style={s.sideCard}>
                  <div style={s.sectionTitle}><Jargon term="Exits">Exits</Jargon> ({exits.length})</div>
                  <div style={{ fontSize: '10px', color: '#999', marginBottom: '6px', lineHeight: 1.4 }}>
                    <Jargon term="Recycling">Recycling</Jargon> headroom ${recycleRoom.toFixed(0)}M of ${recycleCapacity.toFixed(0)}M — proceeds beyond it go straight to LPs
                  </div>
                  {exits.length === 0 ? <div style={{ ...s.empty, padding: '6px 0' }}>None yet</div> : (
                    <div style={{ maxHeight: '90px', overflowY: 'auto' }}>
                      {[...exits].reverse().slice(0, 6).map((e, i) => (
                        <div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '3px 0', fontSize: '10px' }}>
                          <span style={{ color: '#666' }}>{e.name}</span>
                          <span style={{ color: e.exitMOIC >= 1 ? '#15803d' : '#b91c1c', fontWeight: '500' }}>{e.exitMOIC.toFixed(2)}x</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div style={s.sideCard}>
                  <div style={s.sectionTitle}>Written off ({failedCompanies.length})</div>
                  {failedCompanies.length === 0 ? <div style={{ ...s.empty, padding: '6px 0' }}>None yet</div> : (
                    <div style={{ maxHeight: '60px', overflowY: 'auto' }}>
                      {[...failedCompanies].reverse().slice(0, 5).map((f, i) => (
                        <div key={i} style={{ color: '#b91c1c', fontSize: '10px', padding: '2px 0' }}>{f.name}</div>
                      ))}
                    </div>
                  )}
                </div>

                <div style={{ ...s.sideCard, background: '#FAFAF8', border: '1px dashed #d0d0d0' }}>
                  <button onClick={() => setShowRetireConfirm(true)} style={{ width: '100%', padding: '8px', background: 'transparent', border: 'none', fontSize: '11px', color: '#999', cursor: 'pointer' }}
                    onMouseOver={e => e.currentTarget.style.color = '#b91c1c'} onMouseOut={e => e.currentTarget.style.color = '#999'}>
                    Wind the fund down early →
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div className="mobile-sticky-bar">
            <div style={{ fontSize: '11px', color: '#666' }}>
              <span style={{ fontWeight: '600' }}>Q{quarter}/{FUND_LIFE_Q}</span> · <span style={{ color: tvpi >= targetMOIC ? '#15803d' : '#b91c1c' }}>{tvpi.toFixed(2)}x</span>
            </div>
            <button onClick={advanceQuarter} style={{ padding: '10px 20px', background: '#0a0a0a', color: '#fff', border: 'none', borderRadius: '100px', fontSize: '12px', fontWeight: '600', cursor: 'pointer', opacity: queue.length ? 0.5 : 1 }} disabled={queue.length > 0}>
              {queue.length ? 'Resolve first' : quarter >= FUND_LIFE_Q ? 'Close fund →' : 'Next Quarter →'}
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FundGame />);
  </script>
<script>(function(){if(!('highlights' in CSS)||typeof Highlight!=='function')return;var iOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);if(!iOS)return;document.addEventListener('selectionchange',function(){var s=document.getSelection();if(!s||s.isCollapsed||!s.rangeCount){CSS.highlights.delete('selmirror');return}var h=new Highlight();for(var i=0;i<s.rangeCount;i++)h.add(s.getRangeAt(i));CSS.highlights.set('selmirror',h)})})();</script>
</body>
</html>
