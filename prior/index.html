/* ─── quarterly review of the shelf ─────────────────────── */
function needsReview(){
  if (S.reviewDismissed) return false;
  var shelf = byState('shelved');
  if (!shelf.length) return false;
  var last = S.doc.meta.settings.lastReview;
  if (!last) return days(shelf[0].shelf ? shelf[0].shelf.shelvedAt : shelf[0].updated) > 90;
  return days(last) > 90;
}
function renderReview(){
  var shelf = byState('shelved').sort(function(a,b){
    return new Date(a.shelf ? a.shelf.shelvedAt : a.updated) - new Date(b.shelf ? b.shelf.shelvedAt : b.updated);
  });
  if (!S.review || !S.review.queue) S.review = {queue: shelf.map(function(i){ return i.id; }), i:0, moved:0};
  var h = '<div class="wrap">';
  var idea = null;
  while (S.review.i < S.review.queue.length){
    idea = ideaById(S.review.queue[S.review.i]);

  }

    S.doc.meta.settings.lastReview = nowISO(); saveNow();
    h += '<div class="done-mark card"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>'

      + 'The rest are still waiting on the world, which is exactly what the shelf is for.</p>'

  }
  var at = idea.shelf ? idea.shelf.shelvedAt : idea.updated;
  h += '<div class="view-head"><h2>Walking the shelf</h2><p>One question per idea: has the unlock condition happened?</p></div>';
  h += '<div class="card" style="padding:1.3rem 1.4rem">'
    + '<span class="eyebrow">Unlock condition</span>'
    + '<p class="serif" style="font-size:1.3rem;line-height:1.45;color:var(--ink);margin-bottom:.9rem">'+esc((idea.shelf && idea.shelf.unlockCondition) || 'No condition was recorded.')+'</p>'
    + '<div class="shelf-meta" style="margin-bottom:1.1rem"><span class="shelf-wait">waiting '+esc(waited(at))+'</span><span class="dot"></span><button class="shelf-idea" data-open="'+idea.id+'">'+esc(titleOf(idea))+' →</button></div>'
    + '<div class="btn-row"><button class="btn btn-primary" data-review="yes">Yes — bring it back</button>'

  h += '<p class="faint mono" style="font-size:.65rem;margin-top:1rem">'+(S.review.i+1)+' of '+S.review.queue.length+'</p>';

/* ─── forced triage ─────────────────────────────────────── */
function newPair(){
  var act = byState('active');
  if (act.length < 2) return null;
  var a = act[Math.floor(Math.random()*act.length)], b = a;
  var guard = 0;
  while (b === a && guard++ < 40) b = act[Math.floor(Math.random()*act.length)];
  return b === a ? null : [a.id, b.id];
}
function elo(win, lose){
  var K = 32;
  var ew = 1 / (1 + Math.pow(10, (lose.triage.score - win.triage.score)/400));
  win.triage.score = Math.round(win.triage.score + K*(1-ew));
  lose.triage.score = Math.round(lose.triage.score - K*(1-ew));
  win.triage.comparisons++; lose.triage.comparisons++;
  saveNow();
}
function renderTriage(){
  var act = byState('active');
  var h = '<div class="wrap">';
  if (act.length < 12){
    h += '<div class="empty card"><h3>Not yet</h3><p>Forced triage is gated at twelve active ideas. Below that it is theatre — you already know which one you would rather work on. You have '+act.length+'.</p>'
      + '<button class="btn" data-go="ideas">Back to the ideas</button></div></div>';
    return void ($('#v-triage').innerHTML = h);
  }
  if (!S.triage) S.triage = {pair:newPair(), done:0};
  if (!S.triage.pair) S.triage.pair = newPair();
  var a = ideaById(S.triage.pair[0]), b = ideaById(S.triage.pair[1]);
  if (!a || !b){ S.triage.pair = newPair(); a = ideaById(S.triage.pair[0]); b = ideaById(S.triage.pair[1]); }
  h += '<div class="view-head"><h2>Which would you rather spend a month on?</h2>'
    + '<p>Not which is more finished, more fundable, or more likely to work. Which one you would rather spend a month on. Twenty pairs gives a usable ranking of forty ideas.</p></div>';
  h += '<div class="triage-pair">' + [a,b].map(function(i){
    var body = trim(fv(i,'plainSentence')) || trim(i.body);
    return '<button class="triage-card" data-pick="'+i.id+'"><h4>'+esc(titleOf(i))+'</h4>'
      + '<p>'+esc(body.length > 220 ? body.slice(0,220)+'…' : body)+'</p>'
      + '<div class="icard-meta">'+(has(fv(i,'design'))?'<span>'+esc(DESIGN_LABEL[fv(i,'design')])+'</span><span class="dot"></span>':'')
      + '<span>'+esc(ago(i.lastTouched))+'</span></div></button>';
  }).join('') + '</div>';
  h += '<div class="btn-row" style="justify-content:space-between">'
    + '<button class="btn btn-ghost btn-sm" data-triageskip="1">Neither · skip this pair</button>'
    + '<span class="faint mono" style="font-size:.65rem">'+S.triage.done+' compared this round</span></div>';
  if (S.triage.done >= 4){
    h += '<div class="rule"></div><span class="eyebrow">Standing so far</span><div class="list">'
      + act.slice().sort(function(x,y){ return y.triage.score - x.triage.score; }).slice(0,5).map(function(i){
          return '<button class="icard" data-open="'+i.id+'"><div class="icard-top"><span class="icard-title">'+esc(titleOf(i))+'</span>'
            + '<span class="mono faint" style="font-size:.7rem">'+i.triage.score+'</span></div></button>';
        }).join('') + '</div>';
  }
  $('#v-triage').innerHTML = h + '</div>';

function exportZip(){

    var n = 2; while (used[name]) name = base + '-' + (n++);

  });

function b64encode(str){
  return btoa(String.fromCharCode.apply(null, new TextEncoder().encode(str)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64decode(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while (str.length % 4) str += '=';
  var bin = atob(str), bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function shareLink(idea){
  var slim = JSON.parse(JSON.stringify(idea));
  slim.history = slim.history.slice(-40);
  return location.origin + location.pathname + '#data=' + b64encode(JSON.stringify(slim));
}

var VIEWS = {dash:1, ideas:1, detail:1, shelf:1, closed:1, matrix:1, sharpen:1, triage:1, review:1, about:1};
function go(view, id){
  if (!VIEWS[view]) view = 'dash';
  S.view = view;
  if (view === 'detail'){ if (S.ideaId !== id) S.layer = null; S.ideaId = id; S.diff = false; S.diffField = ''; }
  else S.layer = null;
  if (view !== 'sharpen') S.sharpenDone = null;
  var hash = view === 'detail' ? '#/idea/' + id : (view === 'dash' ? '#/' : '#/' + view);
  if (location.hash !== hash) { S.silentHash = true; location.hash = hash; }
  paint();
  window.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}
function readHash(){
  var h = location.hash.replace(/^#/, '');
  if (h.indexOf('data=') === 0 || h.indexOf('/data=') === 0){
    try {
      var raw = b64decode(h.split('data=')[1]);
      var idea = normalise({ideas:[JSON.parse(raw)]}).ideas[0];
      if (idea){
        idea.id = uid();
        S.doc.ideas.unshift(idea);
        saveNow();
        history.replaceState(null, '', location.pathname);
        go('detail', idea.id);
        toast('Imported the shared idea into your own copy.');
        return;
      }
    } catch(e){ toast('That link did not carry a readable idea.'); }
    history.replaceState(null, '', location.pathname);
  }
  var m = /^\/idea\/(.+)$/.exec(h);
  if (m) return go('detail', m[1]);
  var v = h.replace(/^\//,'');
  go(v || 'dash');
}

  else if (S.view === 'shelf') renderShelf();

  if (el('[data-exportidea]') && idea) return exportIdeaSheet(idea);
  if ((b = el('[data-exportmd]'))){
    var i6 = ideaById(b.getAttribute('data-exportmd'));
    download(slug(titleOf(i6)) + '.md', ideaMarkdown(i6), 'text/markdown');
    markExported(); closeSheet(); return toast('Exported as Markdown.');
  }
  if ((b = el('[data-copymd]'))){
    var i7 = ideaById(b.getAttribute('data-copymd'));
    return copy(ideaMarkdown(i7)).then(function(){ closeSheet(); toast('Markdown copied.'); });
  }
  if ((b = el('[data-sharelink]'))){
    var i8 = ideaById(b.getAttribute('data-sharelink'));
    var link = shareLink(i8);
    if (link.length > 30000) { closeSheet(); return toast('Too long for a link — export the Markdown instead.'); }
    return copy(link).then(function(){ closeSheet(); toast('Link copied. It carries the idea itself, and reaches no server.'); });
  }
  if ((b = el('[data-hexport]')) && idea){
    var kind = b.getAttribute('data-hexport');
    download(slug(titleOf(idea)) + '--' + kind + '.md', handoffMarkdown(idea, kind), 'text/markdown');
    markExported(); closeSheet();
    return toast(HANDOFF_LABEL[kind] + ' handoff exported.');
  }
  if (el('[data-exportjson]')) { closeSheet(); return exportJSON(); }
  if (el('[data-exportallmd]')) { closeSheet(); return exportAllMarkdown(); }
  if (el('[data-exportzip]')) { closeSheet(); return exportZip(); }

  /* storage */
  if (el('[data-fsnew]')){
    return Store.chooseNew(S.doc).then(function(name){ closeSheet(); toast('Now writing straight to ' + name + '.'); paint(); })
      .catch(function(){});
  }
  if (el('[data-fsopen]')){
    return Store.chooseExisting().then(function(r){
      if (r && r.doc){ S.doc = normalise(r.doc); saveNow(); }
      closeSheet(); S.pendingHandle = null; toast('Opened ' + r.name + '. Changes write straight to it.'); paint();
    }).catch(function(){ toast('Could not open that file.'); });
  }
  if (el('[data-fsdisconnect]')){
    return Store.disconnect().then(function(){ closeSheet(); toast('Stopped. Still saving in this browser.'); paint(); });
  }
  if (el('[data-regrant]')){
    return Store.pending().then(function(h){
      if (!h) return;
      return Store.grant(h).then(function(doc){
        if (doc){ S.doc = normalise(doc); }
        S.pendingHandle = null; saveNow(); toast('Reconnected.'); paint();
      });
    }).catch(function(){ toast('The browser would not reconnect that file.'); });
  }
  if (el('[data-importmerge]')){
    var incoming = S.pendingImport;
    var mine = {}; S.doc.ideas.forEach(function(x){ mine[x.id] = 1; });
    var add = incoming.ideas.filter(function(x){ return !mine[x.id]; });
    S.doc.ideas = add.concat(S.doc.ideas);
    saveNow(); closeSheet(); S.pendingImport = null;
    toast('Merged ' + add.length + ' idea' + (add.length===1?'':'s') + '.');
    return go('ideas');
  }
  if (el('[data-importreplace]')){
    S.doc = S.pendingImport; saveNow(); closeSheet(); S.pendingImport = null;
    toast('Replaced.'); return go('dash');
  }
  if (el('[data-wipe]')){
    openSheet(sheetHead('Delete everything?', 'Every idea, every prior, every revision. There is no server holding a copy and no undo.')
      + '<div class="sheet-foot"><button class="linkbtn" data-exportjson="1">Export the JSON first</button>'
      + '<div class="btn-row"><button class="btn btn-sm" data-sheetx="1">Keep it all</button>'
      + '<button class="btn btn-sm btn-primary" data-wipeok="1">Delete everything</button></div></div>', {narrow:true});
    return;
  }
  if (el('[data-wipeok]')){
    S.doc = blankDoc(); saveNow(); closeSheet(); toast('Gone.'); return go('dash');
  }
  if (el('[data-intro]') && !el('[data-introx]')) return;
  if (el('[data-introx]')){ S.doc.meta.settings.seenIntro = true; saveNow(); return renderDash(); }
  if (el('[data-dismissreview]')){ S.reviewDismissed = true; return renderDash(); }

  /* rituals */
  if (el('[data-sharpsave]')){
    var pick = pickSharpen(); if (!pick) return;
    var inp = $('#sharpenIn');
    var val3 = inp ? inp.value : '';
    if (!trim(val3)) { if (inp) inp.focus(); return toast('Nothing to save — that is allowed. Skip it instead.'); }
    setField(pick.idea, pick.f.k, val3);
    S.sharpenDone = {label: pick.f.label, ideaId: pick.idea.id};
    S.sharpen = null;
    toast('Saved.');
    return renderSharpen();
  }
  if ((b = el('[data-sharpradio]'))){
    var pick2 = pickSharpen(); if (!pick2) return;
    setField(pick2.idea, pick2.f.k, b.getAttribute('data-sharpradio'), true);
    S.sharpenDone = {label: pick2.f.label, ideaId: pick2.idea.id};
    S.sharpen = null; toast('Saved.'); return renderSharpen();
  }
  if (el('[data-sharpskip]')){ S.sharpenDone = null; nextSharpen(); return renderSharpen(); }
  if (el('[data-sharpanother]')){ S.sharpenDone = null; nextSharpen(); return renderSharpen(); }
  if ((b = el('[data-review]'))){
    var ans = b.getAttribute('data-review');
    var ri = ideaById(S.review.queue[S.review.i]);
    if (ri){
      if (ans === 'yes'){ doReopen(ri); S.review.moved++; toast('Back in play.'); }
      else if (ans === 'never'){ doClose(ri, 'no data and none coming', 'Unlock condition judged never going to happen.'); }
    }
    S.review.i++; return renderReview();
  }
  if ((b = el('[data-pick]'))){
    var winId = b.getAttribute('data-pick');
    var w = ideaById(winId), l = ideaById(S.triage.pair[0] === winId ? S.triage.pair[1] : S.triage.pair[0]);
    if (w && l) elo(w, l);
    S.triage.done++; S.triage.pair = newPair();
    return renderTriage();
  }
  if (el('[data-triageskip]')){ S.triage.pair = newPair(); return renderTriage(); }
}, false);

/* Leaving a field closes its layer in the diff, locks the prior, and unlocks the
   next link of the identification chain — all swapped in place, so focus is
   never stolen from wherever the reader went next. */
function unlockNextStep(idea, key){
  var chain = tier3Fields(idea), i = -1;
  for (var n=0;n<chain.length;n++) if (chain[n].k === key) i = n;
  if (i < 0) return;
  var step = document.querySelector('[data-field-wrap="'+key+'"]');
  if (step && step.closest('.step')) step.closest('.step').classList.toggle('done', has(fv(idea,key)));
  if (i + 1 >= chain.length || !has(fv(idea,key))) return;
  var next = chain[i+1];
  var collapsed = document.querySelector('.step.locked-step[data-openstep="'+next.k+'"]');
  if (!collapsed) return;
  S.openTiers['step_'+next.k] = true;
  var holder = document.createElement('div');
  holder.innerHTML = '<div class="step">' + fieldHTML(idea, next) + '</div>';
  collapsed.parentNode.replaceChild(holder.firstChild, collapsed);
}
document.addEventListener('focusout', function(e){
  var t = e.target;
  if (!t || !t.hasAttribute) return;
  var idea = current();
  if (!idea || S.view !== 'detail') return;
  if (t.hasAttribute('data-anchor')){
    var ak = t.getAttribute('data-anchor');
    if (idea.anchor[ak] !== t.value){ var pv = idea.anchor[ak]; idea.anchor[ak] = t.value; pushHistory(idea, 'anchor.'+ak, pv, t.value, false); touch(idea); save(); }
    S.layer = null;
    return refreshRings();
  }
  if (t.hasAttribute('data-body')){ if (idea.body !== t.value){ var pb = idea.body; idea.body = t.value; pushHistory(idea, 'body', pb, t.value, false); touch(idea); save(); } S.layer = null; return; }
  if (t.hasAttribute('data-title')){ if (idea.title !== t.value){ var pt2 = idea.title; idea.title = t.value; pushHistory(idea, 'title', pt2, t.value, false); touch(idea); save(); } S.layer = null; return; }
  if (!t.hasAttribute('data-f')) return;
  var key = t.getAttribute('data-f');
  setField(idea, key, t.value);
  S.layer = null;
  refreshRings();
  unlockNextStep(idea, key);
  if (key === 'priorKnown' && !S.unlocked.priorKnown && has(t.value)){
    var wrap = t.closest('[data-field-wrap="priorKnown"]');
    if (wrap){
      var h2 = document.createElement('div');
      h2.innerHTML = priorLockedHTML(idea);
      wrap.parentNode.replaceChild(h2.firstChild, wrap);
    }
  }
});

/* tag entry */
document.addEventListener('keydown', function(e){
  var t = e.target;
  if (t && t.hasAttribute && t.hasAttribute('data-tagadd') && (e.key === 'Enter' || e.key === ',')){
    e.preventDefault();
    var idea = current(); if (!idea) return;
    var v = trim(t.value).replace(/^#/,'');
    if (!v) return;
    if (idea.tags.indexOf(v) < 0) idea.tags.push(v);
    t.value = ''; touch(idea); saveNow(); renderDetail();
    var tag = $('[data-tagadd]'); if (tag) tag.focus();
  }
});

/* ─── keyboard ──────────────────────────────────────────── */
function typing(el){
  if (!el) return false;
  var n = el.tagName;
  return n === 'INPUT' || n === 'TEXTAREA' || n === 'SELECT' || el.isContentEditable;
}
function moveCursor(d){
  var cards = $$('#ideaList .icard');
  if (!cards.length) return;
  cards.forEach(function(c){ c.classList.remove('cursor'); });
  S.cursor = Math.max(0, Math.min(cards.length-1, (S.cursor < 0 ? (d > 0 ? 0 : cards.length-1) : S.cursor + d)));
  var c = cards[S.cursor];
  c.classList.add('cursor');
  c.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}
var gPending = false, gTimer;
document.addEventListener('keydown', function(e){
  var meta = e.metaKey || e.ctrlKey;
  var open = $('#scrim').classList.contains('open');

  if (meta && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); return captureSheet(); }

  if (meta && e.key === 'Enter'){
    if (open && $('#capIn')){ e.preventDefault(); return $('[data-capsave]').click(); }
    if ($('#dashCapture') === document.activeElement){ e.preventDefault(); return $('[data-dashsave]').click(); }
    if (S.view === 'sharpen' && $('#sharpenIn')){ e.preventDefault(); return $('[data-sharpsave]').click(); }
    if (open && $('#unlockIn')){ e.preventDefault(); var ok = $('[data-shelveok]'); if (ok) return ok.click(); }
    if (open && $('#promptText')){ e.preventDefault(); return $('[data-copyprompt]').click(); }
    if (document.activeElement && typing(document.activeElement)){ e.preventDefault(); document.activeElement.blur(); return toast('Saved.'); }
  }

  if (e.key === 'Escape'){
    if (open) { e.preventDefault(); return closeSheet(); }
    if (typing(document.activeElement)) { document.activeElement.blur(); return; }
    if (S.view === 'detail'){ if (S.diff){ S.diff = false; return renderDetail(); } return go('ideas'); }
    if (S.view !== 'dash') return go('dash');
    return;
  }

  if (open || typing(document.activeElement)) return;

  if (gPending){
    gPending = false; clearTimeout(gTimer);
    var map = {d:'dash', i:'ideas', s:'shelf', c:'closed', m:'matrix', a:'about', t:'triage'};
    if (map[e.key]){ e.preventDefault(); return go(map[e.key]); }
  }
  if (e.key === 'g'){ gPending = true; clearTimeout(gTimer); gTimer = setTimeout(function(){ gPending = false; }, 900); return; }
  if (e.key === 'c' || e.key === 'n'){ e.preventDefault(); return captureSheet(); }
  if (e.key === '?'){ e.preventDefault(); return shortcutsSheet(); }
  if (e.key === '/'){
    e.preventDefault();
    if (S.view !== 'ideas') go('ideas');
    var q = $('#q'); if (q) q.focus();
    return;
  }
  if (S.view === 'ideas'){
    if (e.key === 'j'){ e.preventDefault(); return moveCursor(1); }
    if (e.key === 'k'){ e.preventDefault(); return moveCursor(-1); }
    if (e.key === 'Enter'){
      var cards = $$('#ideaList .icard');
      if (S.cursor >= 0 && cards[S.cursor]){ e.preventDefault(); cards[S.cursor].click(); }
      return;
    }
  }
  if (S.view === 'dash' && e.key === 's'){ e.preventDefault(); nextSharpen(); return go('sharpen'); }
});

/* ─── import ────────────────────────────────────────────── */
function handleImportFile(file){
  if (!file) return;
  var r = new FileReader();
  r.onload = function(){
    var text = String(r.result || '');
    if (/\.json$/i.test(file.name)){
      try {
        var parsed = normalise(JSON.parse(text));
        if (!parsed.ideas.length && !confirmEmpty()) return;
        return importSheet(parsed, file.name);
      } catch(err){ return toast('That JSON would not parse.'); }
    }
    var fm = parseFrontmatter(text);
    var i = newIdea('');
    var bodyMatch = /##\s*The idea as captured\s*\n+([\s\S]*?)(\n##\s|$)/.exec(fm.body);
    i.body = trim(bodyMatch ? bodyMatch[1] : fm.body.replace(/^#[^\n]*\n/, ''));
    i.title = fm.meta.title || '';
    i.type = fm.meta.type || 'original';
    if (fm.meta.source) i.provenance.source = fm.meta.source;
    if (fm.meta.source_note) i.provenance.note = fm.meta.source_note;
    if (Array.isArray(fm.meta.tags)) i.tags = fm.meta.tags;
    if (fm.meta.design) i.fields.design = {value: fm.meta.design, updated: nowISO()};
    if (fm.meta.data_holder) i.fields.dataHolder = {value: fm.meta.data_holder, updated: nowISO()};
    if (Array.isArray(fm.meta.handoffs)) fm.meta.handoffs.forEach(function(k){ if (k in i.handoffs) i.handoffs[k] = true; });
    if (hasStructure(i)) i.state = 'active';
    S.doc.ideas.unshift(i); saveNow(); closeSheet();
    toast('Imported one idea from Markdown.');
    go('detail', i.id);
  };
  r.readAsText(file);
}
function confirmEmpty(){ return true; }

/* ─── theme, chrome, boot ───────────────────────────────── */
function initialTheme(){
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch(e){}
  if (saved === 'dark') return 'dark';
  if (saved === 'light') return 'light';
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t){
  if (t === 'dark') html.setAttribute('data-theme','dark'); else html.removeAttribute('data-theme');
}
if (!(window.SitePalette && SitePalette.active())) applyTheme(initialTheme());
$('#themeToggle').addEventListener('click', function(){
  var dark = html.getAttribute('data-theme') === 'dark';
  applyTheme(dark ? 'light' : 'dark');
  try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch(e){}
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e){
  var saved = null; try { saved = localStorage.getItem('theme'); } catch(err){}
  if (!saved || saved === 'auto') if (!(window.SitePalette && SitePalette.active())) applyTheme(e.matches ? 'dark' : 'light');
});

var ticking = false;
window.addEventListener('scroll', function(){
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(function(){
    $('#topbar').classList.toggle('scrolled', window.scrollY > 24);
    ticking = false;
  });
}, {passive:true});

window.addEventListener('hashchange', function(){
  if (S.silentHash){ S.silentHash = false; return; }
  readHash();
});
window.addEventListener('beforeunload', function(){ Store.save(S.doc); });

/* boot */
(function boot(){
  var local = Store.load();
  if (local) S.doc = normalise(local);
  readHash();
  if (Store.supportsFS()){
    Store.restore().then(function(r){
      if (!r) return;
      if (r.pending){ S.pendingHandle = r.pending; if (S.view === 'dash') renderDash(); return; }
      if (r.doc){
        var fileDoc = normalise(r.doc);
        var fileNewer = !local || (fileDoc.ideas.length && (!S.doc.ideas.length ||
          new Date(latestTouch(fileDoc)) >= new Date(latestTouch(S.doc))));
        if (fileNewer) S.doc = fileDoc;
        Store.save(S.doc);
        paint();
      }
    }).catch(function(){});
  }
})();
function latestTouch(doc){
  var t = doc.meta.created;
  doc.ideas.forEach(function(i){ if (new Date(i.lastTouched) > new Date(t)) t = i.lastTouched; });
  return t;
}
})();
</script>
